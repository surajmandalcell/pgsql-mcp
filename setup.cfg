[mutmut]
source_paths =
    src/postgres_mcp/
only_mutate =
    src/postgres_mcp/runtime.py
    src/postgres_mcp/migrations/service.py
    src/postgres_mcp/data_ops/service.py
pytest_add_cli_args_test_selection =
    tests/unit/runtime/test_runtime.py
    tests/unit/migrations/test_migration_service.py
    tests/unit/migrations/test_migration_service_defaults.py
    tests/unit/data_ops/test_service.py
mutate_only_covered_lines = true
max_stack_depth = 8
use_git_change_detection = false
timeout_constant = 2.0
timeout_multiplier = 5.0
