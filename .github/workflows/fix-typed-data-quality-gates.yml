name: Fix typed data quality gates

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: fix-typed-data-quality-gates
  cancel-in-progress: false

jobs:
  fix-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Apply test-first quality corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match in {path}, found {count}")
              target.write_text(content.replace(old, new, 1))

          replace_once(
              "src/postgres_mcp/data_ops/domain.py",
              "from dataclasses import dataclass\n",
              "from dataclasses import dataclass\nfrom dataclasses import field\n",
          )
          replace_once(
              "src/postgres_mcp/data_ops/domain.py",
              "    filters: FilterSet = FilterSet()\n",
              "    filters: FilterSet = field(default_factory=FilterSet)\n",
          )

          replace_once(
              "tests/unit/data_ops/test_domain.py",
              "from dataclasses import replace\n",
              "from dataclasses import replace\nfrom typing import Any\nfrom typing import cast\n",
          )
          replace_once(
              "tests/unit/data_ops/test_domain.py",
              '''        SelectRowsRequest(  # type: ignore[arg-type]\n            relation="app.accounts",\n''',
              '''        SelectRowsRequest(\n            relation=cast(Any, "app.accounts"),\n''',
          )
          replace_once(
              "tests/unit/data_ops/test_domain.py",
              '''        SelectRowsRequest(  # type: ignore[arg-type]\n            relation=relation(),\n            columns=(),\n            filters=(),\n''',
              '''        SelectRowsRequest(\n            relation=relation(),\n            columns=(),\n            filters=cast(Any, ()),\n''',
          )
          replace_once(
              "tests/unit/data_ops/test_domain.py",
              '''        InsertRowsRequest(  # type: ignore[arg-type]\n            relation=relation(),\n            rows=("not-a-row",),\n''',
              '''        InsertRowsRequest(\n            relation=relation(),\n            rows=cast(Any, ("not-a-row",)),\n''',
          )

          replace_once(
              "tests/unit/data_ops/test_postgres.py",
              "class TestableRepository(PostgresDataRepository):",
              "class _TestableRepository(PostgresDataRepository):",
          )
          replace_once(
              "tests/unit/data_ops/test_postgres.py",
              "def repository(connection: FakeConnection) -> TestableRepository:",
              "def repository(connection: FakeConnection) -> _TestableRepository:",
          )
          replace_once(
              "tests/unit/data_ops/test_postgres.py",
              "    return TestableRepository(cast(SqlDriver, FakeDriver(connection)), timeout_seconds=1, lock_timeout_seconds=1)",
              "    return _TestableRepository(cast(SqlDriver, FakeDriver(connection)), timeout_seconds=1, lock_timeout_seconds=1)",
          )
          PY
          uv run ruff format src/postgres_mcp/data_ops/domain.py tests/unit/data_ops/test_domain.py tests/unit/data_ops/test_postgres.py

      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -v --log-cli-level=INFO

      - name: Remove temporary workflow and verify scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-typed-data-quality-gates.yml
          git add src/postgres_mcp/data_ops/domain.py \
            tests/unit/data_ops/test_domain.py \
            tests/unit/data_ops/test_postgres.py \
            .github/workflows/fix-typed-data-quality-gates.yml
          git diff --cached --check
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --name-only | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'FILES'
          .github/workflows/fix-typed-data-quality-gates.yml
          src/postgres_mcp/data_ops/domain.py
          tests/unit/data_ops/test_domain.py
          tests/unit/data_ops/test_postgres.py
          FILES
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit validated quality fixes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix typed data quality gates"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/typed-data-operations
