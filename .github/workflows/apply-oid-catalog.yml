name: Diagnose OID catalog transfer

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: diagnose-oid-catalog-transfer
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Reconstruct payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/oid-catalog.patch.b64
          for index in 0 1 2 3 4; do
            tr -d '[:space:]' < "$(printf '.github/patches/oid-catalog/p00-%02d' "$index")" >> /tmp/oid-catalog.patch.b64
          done
          for suffix in a b c; do
            tr -d '[:space:]' < ".github/patches/oid-catalog/p00-05${suffix}" >> /tmp/oid-catalog.patch.b64
          done
          for index in 0 1 2 3 4 5; do
            tr -d '[:space:]' < "$(printf '.github/patches/oid-catalog/p01-%02d' "$index")" >> /tmp/oid-catalog.patch.b64
          done
          for index in 2 3 4; do
            tr -d '[:space:]' < "$(printf '.github/patches/oid-catalog/part%02d' "$index")" >> /tmp/oid-catalog.patch.b64
          done
          for index in 0 1 2 3; do
            tr -d '[:space:]' < "$(printf '.github/patches/oid-catalog/p05-%02d' "$index")" >> /tmp/oid-catalog.patch.b64
          done
          wc -c /tmp/oid-catalog.patch.b64
          sha256sum /tmp/oid-catalog.patch.b64
          base64 --decode /tmp/oid-catalog.patch.b64 > /tmp/oid-catalog.patch || true
          wc -c /tmp/oid-catalog.patch
          sha256sum /tmp/oid-catalog.patch
          git apply --check /tmp/oid-catalog.patch > /tmp/git-apply.txt 2>&1 || true

      - name: Upload reconstructed transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oid-catalog-current-transfer
          path: |
            /tmp/oid-catalog.patch.b64
            /tmp/oid-catalog.patch
            /tmp/git-apply.txt
          if-no-files-found: error
          retention-days: 1
