name: Validate OID catalog implementation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: validate-oid-catalog-implementation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start Docker service
        run: sudo service docker start || true

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Reconstruct and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/oid-catalog.patch.b64
          for index in 0 1 2 3 4; do
            tr -d '[:space:]' < "$(printf '.github/patches/oid-catalog/p00-%02d' "$index")" >> /tmp/oid-catalog.patch.b64
          done
          for suffix in a b c; do
            tr -d '[:space:]' < ".github/patches/oid-catalog/p00-05${suffix}" >> /tmp/oid-catalog.patch.b64
          done
          for index in 0 1 2 3 4 5; do
            tr -d '[:space:]' < "$(printf '.github/patches/oid-catalog/p01-%02d' "$index")" >> /tmp/oid-catalog.patch.b64
          done
          for index in 2 3 4; do
            tr -d '[:space:]' < "$(printf '.github/patches/oid-catalog/part%02d' "$index")" >> /tmp/oid-catalog.patch.b64
          done
          for index in 0 1 2 3; do
            tr -d '[:space:]' < "$(printf '.github/patches/oid-catalog/p05-%02d' "$index")" >> /tmp/oid-catalog.patch.b64
          done
          test "$(wc -c < /tmp/oid-catalog.patch.b64)" -eq 101412
          test "$(sha256sum /tmp/oid-catalog.patch.b64 | cut -d' ' -f1)" = "7f549138656ed419cb37960b25e03de71791c46a8cdf95bb3335f4c0382c2fab"
          base64 --decode /tmp/oid-catalog.patch.b64 > /tmp/oid-catalog.patch
          test "$(sha256sum /tmp/oid-catalog.patch | cut -d' ' -f1)" = "7a9496805fbf9ec119f13e4cbaccb39eac68a7f6b99e3f17a1df5f1cb17bcc5b"
          git apply --check /tmp/oid-catalog.patch
          git apply /tmp/oid-catalog.patch
          rm -rf .github/patches/oid-catalog
          rm .github/workflows/apply-oid-catalog.yml

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Run test-first quality gates
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee /tmp/ruff-format.txt
          format_status=${PIPESTATUS[0]}
          uv run ruff check . 2>&1 | tee /tmp/ruff-lint.txt
          lint_status=${PIPESTATUS[0]}
          uv run pyright 2>&1 | tee /tmp/pyright.txt
          type_status=${PIPESTATUS[0]}
          uv run pytest -v --log-cli-level=INFO --junitxml=/tmp/pytest-results.xml 2>&1 | tee /tmp/pytest-output.txt
          test_status=${PIPESTATUS[0]}
          printf 'format=%s\nlint=%s\ntypes=%s\ntests=%s\n' "$format_status" "$lint_status" "$type_status" "$test_status" | tee /tmp/status.txt
          test "$format_status" -eq 0
          test "$lint_status" -eq 0
          test "$type_status" -eq 0
          test "$test_status" -eq 0

      - name: Package exact applied workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.venv --exclude=.pytest_cache --exclude='**/__pycache__' -czf /tmp/oid-catalog-workspace.tar.gz .

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oid-catalog-validation-evidence
          path: |
            /tmp/status.txt
            /tmp/ruff-format.txt
            /tmp/ruff-lint.txt
            /tmp/pyright.txt
            /tmp/pytest-output.txt
            /tmp/pytest-results.xml
            /tmp/oid-catalog-workspace.tar.gz
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce quality result
        if: steps.quality.outcome != 'success'
        run: exit 1
