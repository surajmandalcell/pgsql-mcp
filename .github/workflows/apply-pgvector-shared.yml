name: Apply pgvector shared surfaces

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-pgvector-shared-surfaces
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.ref == 'feature/pgvector-catalog-diagnostics-v3' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Apply shared pgvector surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def insert_after_line(path: Path, anchor: str, addition: str) -> None:
              source = path.read_text()
              if addition in source:
                  return
              marker = anchor + "\n"
              if source.count(marker) != 1:
                  raise RuntimeError(f"missing unique line anchor in {path}: {anchor!r}")
              path.write_text(source.replace(marker, marker + addition + "\n", 1))


          def insert_before(path: Path, anchor: str, addition: str, present: str) -> None:
              source = path.read_text()
              if present in source:
                  return
              if source.count(anchor) != 1:
                  raise RuntimeError(f"missing unique insertion anchor in {path}: {anchor!r}")
              path.write_text(source.replace(anchor, addition + anchor, 1))


          def insert_mapping_sibling(path: Path, key: str, addition: str, present: str) -> None:
              source = path.read_text()
              if present in source:
                  return
              lines = source.splitlines(keepends=True)
              matches = [index for index, line in enumerate(lines) if line.strip() == f'"{key}": {{']
              if len(matches) != 1:
                  raise RuntimeError(f"missing unique mapping key in {path}: {key!r}")
              start = matches[0]
              indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
              end = next(
                  (index for index in range(start + 1, len(lines)) if lines[index].rstrip("\n") == indent + "},"),
                  None,
              )
              if end is None:
                  raise RuntimeError(f"mapping block does not close in {path}: {key!r}")
              lines.insert(end + 1, addition)
              path.write_text("".join(lines))


          readme = Path("README.md")
          insert_after_line(
              readme,
              "- Report PostGIS columns and spatial indexes from PostgreSQL core catalogs.",
              "- Report pgvector columns and indexes from PostgreSQL core catalogs.",
          )
          insert_after_line(
              readme,
              "- PostGIS diagnostics return at most 500 combined columns and indexes.",
              "- pgvector diagnostics return at most 500 combined columns and indexes.",
          )
          insert_after_line(
              readme,
              "| `get_postgis_diagnostics` | Report bounded PostGIS columns and spatial indexes |",
              "| `get_pgvector_diagnostics` | Report bounded pgvector columns and indexes |",
          )

          server = Path("src/postgres_mcp/server.py")
          insert_after_line(
              server,
              "from .postgis_diagnostics import PostgresPostgisRepository  # noqa: E402",
              "from .pgvector_diagnostics import MAX_PGVECTOR_ITEMS  # noqa: E402\n"
              "from .pgvector_diagnostics import PgvectorCatalogError  # noqa: E402\n"
              "from .pgvector_diagnostics import PostgresPgvectorRepository  # noqa: E402",
          )
          insert_before(
              server,
              "def get_migration_service() -> MigrationService:\n",
              '''def get_pgvector_repository() -> PostgresPgvectorRepository:
              """Build the bounded read-only pgvector catalog repository."""
              return PostgresPgvectorRepository(
                  get_base_sql_driver(),
                  timeout_seconds=max(1.0, float(current_query_timeout)),
              )


          ''',
              "def get_pgvector_repository() -> PostgresPgvectorRepository:",
          )
          insert_mapping_sibling(
              server,
              "postgis_diagnostics",
              '''                "pgvector_diagnostics": {
                      "read_only": True,
                      "core_catalogs_only": True,
                      "extension_functions_called": False,
                      "max_items": MAX_PGVECTOR_ITEMS,
                      "types": ["vector", "halfvec", "sparsevec", "bit"],
                      "index_methods": ["hnsw", "ivfflat"],
                  },
          ''',
              '"pgvector_diagnostics": {',
          )
          insert_before(
              server,
              '@mcp.tool(description="Search relations, routines, types, collations, and extensions")\n',
              '''@mcp.tool(description="Report bounded pgvector columns and indexes through PostgreSQL core catalogs")
          async def get_pgvector_diagnostics(
              max_columns: Annotated[
                  int,
                  Field(description="Maximum pgvector columns", ge=1, le=MAX_PGVECTOR_ITEMS - 1),
              ] = 250,
              max_indexes: Annotated[
                  int,
                  Field(description="Maximum pgvector indexes", ge=1, le=MAX_PGVECTOR_ITEMS - 1),
              ] = 250,
          ) -> ResponseType:
              """Return read-only pgvector column, dimension, index, and validity metadata."""
              try:
                  snapshot = await get_pgvector_repository().snapshot(
                      max_columns=max_columns,
                      max_indexes=max_indexes,
                  )
                  return format_text_response(snapshot.to_payload())
              except PgvectorCatalogError as exc:
                  return format_error_response(str(exc))
              except Exception as exc:
                  logger.exception("Unexpected pgvector catalog diagnostic error")
                  return format_error_response(str(exc))


          ''',
              "async def get_pgvector_diagnostics(",
          )

          capability_test = Path("tests/unit/server/test_extension_profile_tools.py")
          insert_mapping_sibling(
              capability_test,
              "postgis_diagnostics",
              '''        "pgvector_diagnostics": {
                  "read_only": True,
                  "core_catalogs_only": True,
                  "extension_functions_called": False,
                  "max_items": 500,
                  "types": ["vector", "halfvec", "sparsevec", "bit"],
                  "index_methods": ["hnsw", "ivfflat"],
              },
          ''',
              '"pgvector_diagnostics": {',
          )
          PY

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Validate shared integration
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/postgres_mcp/server.py \
            tests/unit/server/test_extension_profile_tools.py
          uv run ruff check --fix \
            src/postgres_mcp/server.py \
            tests/unit/server/test_extension_profile_tools.py
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/extensions/test_pgvector_catalog_validation.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py \
            tests/unit/server/test_postgis_diagnostic_tools.py \
            tests/unit/server/test_extension_profile_tools.py

      - name: Remove integration scaffolding
        run: |
          rm -f .github/workflows/apply-pgvector-shared.yml
          rm -f .github/pgvector-shared-trigger

      - name: Commit shared integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expose pgvector diagnostics beside PostGIS"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/pgvector-catalog-diagnostics-v3
