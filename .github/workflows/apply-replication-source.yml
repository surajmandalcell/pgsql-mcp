name: Apply replication and HA source bundle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-replication-ha-source
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Start Docker
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.6.9'

      - name: Extract reviewed source
        run: python .replication-transfer/publish.py

      - name: Validate complete source
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          uv run ruff format src/postgres_mcp/replication tests/unit/replication
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q

      - name: Commit validated source files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/postgres-compatibility.yml
          git add -- \
            README.md docs/compatibility.md docs/replication.md pyproject.toml \
            src/postgres_mcp/__init__.py src/postgres_mcp/ha_server.py \
            src/postgres_mcp/lite_server.py src/postgres_mcp/replication \
            tests/integration/replication tests/unit/ha tests/unit/replication \
            tests/unit/lite/test_lite_server.py tests/unit/lite/test_packaging.py
          git diff --cached --check
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git status --short
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement replication and HA diagnostics'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/replication-ha-readiness
