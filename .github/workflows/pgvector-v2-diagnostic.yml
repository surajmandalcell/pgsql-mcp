name: Current-main pgvector diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: current-main-pgvector-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/pgvector-catalog-diagnostics-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PGSQL_MCP_TEST_POSTGRES_IMAGE: postgres:16

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Copy pinned validated source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/pgvector-catalog-diagnostics
          source_commit=a6a54a9b122c06483c7da27b2c36ac5832294181
          for path in \
            docs/pgvector.md \
            src/postgres_mcp/pgvector_diagnostics.py \
            src/postgres_mcp/server.py \
            tests/Dockerfile.postgres-hypopg \
            tests/integration/extensions/test_pgvector_diagnostics_integration.py \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py
          do
            mkdir -p "$(dirname "$path")"
            git show "${source_commit}:$path" > "$path"
          done
          python scripts/apply_pgvector_readme.py

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Capture validation gates
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run ruff format \
            scripts/apply_pgvector_readme.py \
            src/postgres_mcp/pgvector_diagnostics.py \
            src/postgres_mcp/server.py \
            tests/integration/extensions/test_pgvector_diagnostics_integration.py \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py \
            2>&1 | tee /tmp/ruff-format.txt
          uv run ruff check --fix \
            scripts/apply_pgvector_readme.py \
            src/postgres_mcp/pgvector_diagnostics.py \
            src/postgres_mcp/server.py \
            tests/integration/extensions/test_pgvector_diagnostics_integration.py \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py \
            2>&1 | tee /tmp/ruff-fix.txt
          python scripts/check_ste_docs.py . 2>&1 | tee /tmp/ste.txt
          ste_status=${PIPESTATUS[0]}
          uv run ruff format --check . 2>&1 | tee /tmp/ruff-format-check.txt
          format_status=${PIPESTATUS[0]}
          uv run ruff check . 2>&1 | tee /tmp/ruff-check.txt
          lint_status=${PIPESTATUS[0]}
          uv run pyright 2>&1 | tee /tmp/pyright.txt
          pyright_status=${PIPESTATUS[0]}
          uv run pytest -q \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py \
            tests/integration/extensions/test_pgvector_diagnostics_integration.py \
            2>&1 | tee /tmp/focused.txt
          focused_status=${PIPESTATUS[0]}
          uv run pytest -q --junitxml=/tmp/pytest.xml 2>&1 | tee /tmp/pytest.txt
          pytest_status=${PIPESTATUS[0]}
          printf 'ste=%s\nformat=%s\nlint=%s\npyright=%s\nfocused=%s\npytest=%s\n' \
            "$ste_status" "$format_status" "$lint_status" "$pyright_status" "$focused_status" "$pytest_status" \
            | tee /tmp/status.txt
          tar --exclude=.git --exclude=.venv --exclude=.pytest_cache --exclude='**/__pycache__' -czf /tmp/workspace.tar.gz .
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-main-pgvector-diagnostics
          path: |
            /tmp/ste.txt
            /tmp/ruff-format.txt
            /tmp/ruff-fix.txt
            /tmp/ruff-format-check.txt
            /tmp/ruff-check.txt
            /tmp/pyright.txt
            /tmp/focused.txt
            /tmp/pytest.txt
            /tmp/pytest.xml
            /tmp/status.txt
            /tmp/workspace.tar.gz
          if-no-files-found: error
          retention-days: 7
