name: Export reviewed migration git workspace

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: export-reviewed-migration-git-workspace
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Package exact git workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.venv --exclude=.pytest_cache --exclude='**/__pycache__' \
            -czf /tmp/reviewed-migrations-git-workspace.tar.gz .

      - name: Upload exact git workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-migrations-git-workspace
          path: /tmp/reviewed-migrations-git-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
