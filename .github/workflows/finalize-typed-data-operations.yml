name: Finalize typed data operations

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: finalize-typed-data-operations
  cancel-in-progress: false

jobs:
  format-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Apply pinned mechanical formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix . || true

      - name: Run complete quality gates with diagnostics
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee /tmp/ruff-format.txt
          format_status=${PIPESTATUS[0]}
          uv run ruff check . 2>&1 | tee /tmp/ruff-lint.txt
          lint_status=${PIPESTATUS[0]}
          uv run pyright 2>&1 | tee /tmp/pyright.txt
          type_status=${PIPESTATUS[0]}
          uv run pytest -v --log-cli-level=INFO --junitxml=/tmp/pytest-results.xml 2>&1 | tee /tmp/pytest-output.txt
          test_status=${PIPESTATUS[0]}
          printf 'format=%s\nlint=%s\ntypes=%s\ntests=%s\n' "$format_status" "$lint_status" "$type_status" "$test_status" | tee /tmp/quality-status.txt
          test "$format_status" -eq 0
          test "$lint_status" -eq 0
          test "$type_status" -eq 0
          test "$test_status" -eq 0

      - name: Package exact validated workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude=.pytest_cache --exclude='**/__pycache__' \
            -czf /tmp/typed-data-operations-workspace.tar.gz .

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typed-data-operations-validation
          path: |
            /tmp/quality-status.txt
            /tmp/ruff-format.txt
            /tmp/ruff-lint.txt
            /tmp/pyright.txt
            /tmp/pytest-output.txt
            /tmp/pytest-results.xml
            /tmp/typed-data-operations-workspace.tar.gz
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce quality gates
        if: steps.quality.outcome != 'success'
        run: exit 1

      - name: Remove workflow and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-typed-data-operations.yml
          git add -A
          git diff --cached --check
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --name-only | sort > /tmp/changed-files
          allowed='^(\.github/workflows/finalize-typed-data-operations\.yml|README\.md|docs/data-operations\.md|src/postgres_mcp/data_ops/(__init__|domain|postgres|service)\.py|src/postgres_mcp/server\.py|tests/integration/data_ops/test_data_ops_integration\.py|tests/unit/data_ops/test_(domain|postgres|service)\.py|tests/unit/server/test_data_tools\.py)$'
          unexpected=$(grep -Ev "$allowed" /tmp/changed-files || true)
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected changed files:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit the green source-only implementation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish typed guarded data operations"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/typed-data-operations
