name: ASD-STE100 project profile

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ste-profile-main
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check the ASD-STE100 project profile
        run: python scripts/check_ste_docs.py .
