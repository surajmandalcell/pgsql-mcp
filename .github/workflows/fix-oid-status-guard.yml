name: Fix OID catalog staging guard

on:
  push:
    branches:
      - feature/oid-catalog-types
    paths:
      - .github/workflows/fix-oid-status-guard.yml

permissions:
  contents: write

concurrency:
  group: fix-oid-catalog-staging-guard
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Update only the status enumeration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-oid-catalog.yml')
          content = path.read_text()
          old = '          git status --porcelain > /tmp/status\n'
          new = '          git status --porcelain --untracked-files=all > /tmp/status\n'
          if content.count(old) != 1:
              raise RuntimeError('expected exactly one staging status command')
          path.write_text(content.replace(old, new, 1))
          PY
          rm .github/workflows/fix-oid-status-guard.yml
          expected='.github/workflows/apply-oid-catalog.yml
          .github/workflows/fix-oid-status-guard.yml'
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Commit the reviewed workflow correction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-oid-catalog.yml .github/workflows/fix-oid-status-guard.yml
          git diff --cached --check
          git commit -m "Enumerate catalog staging changes per file"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/oid-catalog-types
