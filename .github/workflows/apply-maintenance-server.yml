name: Apply reviewed maintenance MCP surface

on:
  push:
    branches:
      - feature/reviewed-maintenance
    paths:
      - .github/workflows/apply-maintenance-server.yml

permissions:
  contents: write

concurrency:
  group: apply-reviewed-maintenance-server
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Apply deterministic MCP and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match in {path}, found {count}")
              target.write_text(content.replace(old, new, 1))

          server = "src/postgres_mcp/server.py"
          replace_once(
              server,
              "from .migrations import PostgresMigrationBackend  # noqa: E402\n",
              """from .migrations import PostgresMigrationBackend  # noqa: E402
          from .maintenance import MaintenanceError  # noqa: E402
          from .maintenance import MaintenanceExecutionError  # noqa: E402
          from .maintenance import MaintenanceOperation  # noqa: E402
          from .maintenance import MaintenanceOptions  # noqa: E402
          from .maintenance import MaintenanceRequest  # noqa: E402
          from .maintenance import MaintenanceService  # noqa: E402
          from .maintenance import MaintenanceTarget  # noqa: E402
          from .maintenance import PostgresMaintenanceBackend  # noqa: E402
          from .maintenance import ReconciliationResolution  # noqa: E402
          """,
          )
          replace_once(
              server,
              'current_migration_schema = "public"\n',
              'current_migration_schema = "public"\ncurrent_maintenance_schema = "public"\n',
          )
          replace_once(
              server,
              """def get_data_service() -> DataService:
              \"\"\"Build the structured data-operations application service.\"\"\"
          """,
              """def get_maintenance_service() -> MaintenanceService:
              \"\"\"Build the reviewed nontransactional maintenance service.\"\"\"
              return MaintenanceService(
                  PostgresMaintenanceBackend(
                      get_base_sql_driver(),
                      ledger_schema=current_maintenance_schema,
                      inspection_timeout_seconds=max(1, int(current_query_timeout)),
                  )
              )


          def get_data_service() -> DataService:
              \"\"\"Build the structured data-operations application service.\"\"\"
          """,
          )
          replace_once(
              server,
              """def format_text_response(text: Any) -> ResponseType:
          """,
              """def _maintenance_request(
              *,
              name: str,
              operation: str,
              schema_name: str,
              target_name: str,
              skip_locked: bool,
              index_cleanup: str,
              parallel: int,
          ) -> MaintenanceRequest:
              return MaintenanceRequest(
                  name=name,
                  operation=MaintenanceOperation(operation),
                  target=MaintenanceTarget(schema_name, target_name),
                  options=MaintenanceOptions(
                      skip_locked=skip_locked,
                      index_cleanup=index_cleanup,
                      parallel=parallel,
                  ),
              )


          def format_text_response(text: Any) -> ResponseType:
          """,
          )
          replace_once(
              server,
              """            \"data_operations\": {
          """,
              """            \"maintenance\": {
                  \"planning\": True,
                  \"apply_available\": current_access_mode is AccessMode.UNRESTRICTED,
                  \"review_hash_required\": True,
                  \"transaction_behavior\": \"non_transactional\",
                  \"rollback_available\": False,
                  \"durable_status\": [\"running\", \"succeeded\", \"failed\", \"unknown\"],
                  \"unknown_outcome_reconciliation\": True,
                  \"supported_operations\": [
                      \"vacuum_analyze\",
                      \"analyze\",
                      \"reindex_index_concurrently\",
                      \"refresh_materialized_view_concurrently\",
                  ],
              },
              \"data_operations\": {
          """,
          )
          marker = '@mcp.tool(description="Explain a SQL query and optionally simulate hypothetical indexes")\n'
          maintenance_tools = '''@mcp.tool(description="Create a reviewed nontransactional PostgreSQL maintenance plan")
          async def create_maintenance_plan(
              name: Annotated[str, Field(description="Stable maintenance operation name")],
              operation: Annotated[
                  Literal[
                      "vacuum_analyze",
                      "analyze",
                      "reindex_index_concurrently",
                      "refresh_materialized_view_concurrently",
                  ],
                  Field(description="Structured maintenance operation"),
              ],
              schema_name: Annotated[str, Field(description="Exact target schema")],
              target_name: Annotated[str, Field(description="Exact relation or index name")],
              skip_locked: Annotated[bool, Field(description="Skip relations that cannot be locked immediately")] = False,
              index_cleanup: Annotated[Literal["auto", "on", "off"], Field(description="VACUUM index cleanup policy")] = "auto",
              parallel: Annotated[int, Field(description="VACUUM parallel workers", ge=0, le=1024)] = 0,
          ) -> ResponseType:
              try:
                  request = _maintenance_request(
                      name=name,
                      operation=operation,
                      schema_name=schema_name,
                      target_name=target_name,
                      skip_locked=skip_locked,
                      index_cleanup=index_cleanup,
                      parallel=parallel,
                  )
                  return format_text_response((await get_maintenance_service().plan(request)).to_payload())
              except (MaintenanceError, ValueError) as exc:
                  return format_error_response(str(exc))
              except Exception as exc:
                  logger.exception("Unexpected maintenance planning error")
                  return format_error_response(str(exc))


          @mcp.tool(description="Apply an exact reviewed nontransactional maintenance plan")
          async def apply_maintenance_plan(
              name: Annotated[str, Field(description="Stable maintenance operation name")],
              operation: Annotated[
                  Literal[
                      "vacuum_analyze",
                      "analyze",
                      "reindex_index_concurrently",
                      "refresh_materialized_view_concurrently",
                  ],
                  Field(description="Structured maintenance operation"),
              ],
              schema_name: Annotated[str, Field(description="Exact target schema")],
              target_name: Annotated[str, Field(description="Exact relation or index name")],
              review_hash: Annotated[str, Field(description="Exact review hash returned by create_maintenance_plan")],
              skip_locked: Annotated[bool, Field(description="Skip relations that cannot be locked immediately")] = False,
              index_cleanup: Annotated[Literal["auto", "on", "off"], Field(description="VACUUM index cleanup policy")] = "auto",
              parallel: Annotated[int, Field(description="VACUUM parallel workers", ge=0, le=1024)] = 0,
              timeout_seconds: Annotated[int, Field(ge=1, le=7200)] = 300,
              lock_timeout_seconds: Annotated[int, Field(ge=1, le=300)] = 5,
          ) -> ResponseType:
              if current_access_mode is not AccessMode.UNRESTRICTED:
                  return format_error_response("reviewed maintenance apply requires --access-mode=unrestricted")
              try:
                  request = _maintenance_request(
                      name=name,
                      operation=operation,
                      schema_name=schema_name,
                      target_name=target_name,
                      skip_locked=skip_locked,
                      index_cleanup=index_cleanup,
                      parallel=parallel,
                  )
                  service = get_maintenance_service()
                  plan = await service.plan(request)
                  result = await service.apply(
                      plan,
                      review_hash=review_hash,
                      timeout_seconds=timeout_seconds,
                      lock_timeout_seconds=lock_timeout_seconds,
                  )
                  return format_text_response(result.to_payload())
              except MaintenanceExecutionError as exc:
                  return format_text_response(exc.to_payload())
              except (MaintenanceError, ValueError) as exc:
                  return format_error_response(str(exc))
              except Exception as exc:
                  logger.exception("Unexpected maintenance apply error")
                  return format_error_response(str(exc))


          @mcp.tool(description="List redacted reviewed maintenance status records")
          async def get_maintenance_status(
              limit: Annotated[int, Field(description="Maximum status rows", ge=1, le=500)] = 100,
          ) -> ResponseType:
              try:
                  return format_text_response((await get_maintenance_service().status(limit=limit)).to_payload())
              except (MaintenanceError, ValueError) as exc:
                  return format_error_response(str(exc))
              except Exception as exc:
                  logger.exception("Unexpected maintenance status error")
                  return format_error_response(str(exc))


          @mcp.tool(description="Reconcile a reviewed maintenance operation after external outcome verification")
          async def reconcile_maintenance_operation(
              name: Annotated[str, Field(description="Stable maintenance operation name")],
              review_hash: Annotated[str, Field(description="Exact stored review hash")],
              resolution: Annotated[Literal["succeeded", "failed"], Field(description="Externally verified outcome")],
          ) -> ResponseType:
              if current_access_mode is not AccessMode.UNRESTRICTED:
                  return format_error_response("maintenance reconciliation requires --access-mode=unrestricted")
              try:
                  result = await get_maintenance_service().reconcile(
                      name=name,
                      review_hash=review_hash,
                      resolution=ReconciliationResolution(resolution),
                  )
                  return format_text_response(result.to_payload())
              except MaintenanceExecutionError as exc:
                  return format_text_response(exc.to_payload())
              except (MaintenanceError, ValueError) as exc:
                  return format_error_response(str(exc))
              except Exception as exc:
                  logger.exception("Unexpected maintenance reconciliation error")
                  return format_error_response(str(exc))


          '''
          replace_once(server, marker, maintenance_tools + marker)
          replace_once(
              server,
              """    parser.add_argument(
                  \"--migration-schema\",
                  default=os.environ.get(\"MIGRATION_SCHEMA\", \"public\"),
                  help=\"Existing schema that owns the trusted reviewed-migration ledger\",
              )
          """,
              """    parser.add_argument(
                  \"--migration-schema\",
                  default=os.environ.get(\"MIGRATION_SCHEMA\", \"public\"),
                  help=\"Existing schema that owns the trusted reviewed-migration ledger\",
              )
              parser.add_argument(
                  \"--maintenance-schema\",
                  default=os.environ.get(\"MAINTENANCE_SCHEMA\", \"public\"),
                  help=\"Existing schema that owns the trusted reviewed-maintenance ledger\",
              )
          """,
          )
          replace_once(
              server,
              """    global current_max_rows
              global current_migration_schema
              global current_query_timeout
          """,
              """    global current_max_rows
              global current_maintenance_schema
              global current_migration_schema
              global current_query_timeout
          """,
          )
          replace_once(
              server,
              """    current_migration_schema = args.migration_schema
              QueryLimits(
          """,
              """    current_migration_schema = args.migration_schema
              current_maintenance_schema = args.maintenance_schema
              QueryLimits(
          """,
          )

          Path("docs/maintenance.md").write_text(
              '''# Reviewed nontransactional maintenance

          Maintenance is a separate bounded context from raw SQL, typed data operations, and transactional migrations. It covers PostgreSQL operations whose effects cannot be honestly represented as one rollback-guaranteed transaction.

          ## Workflow

          1. Call `create_maintenance_plan` with a stable name, structured operation, and exact schema-qualified target.
          2. Review the live target OID, relation kind, persistence, preconditions, options, warnings, and `review_hash`.
          3. Call `apply_maintenance_plan` with the exact same request and review hash.
          4. Inspect `get_maintenance_status` for redacted durable state.
          5. When an execution outcome is `unknown`, verify PostgreSQL externally and call `reconcile_maintenance_operation` with the exact review hash and explicit outcome.

          Planning and status are available in restricted mode. Apply and reconciliation require `--access-mode=unrestricted` and a least-privilege role with only the required maintenance privileges.

          ## Supported operations

          - `vacuum_analyze`
          - `analyze`
          - `reindex_index_concurrently`
          - `refresh_materialized_view_concurrently`

          There is no raw SQL parameter and no maintenance rollback tool. The planner validates operation-specific relation kinds and options, binds the plan to the live target OID and catalog preconditions, and refuses temporary targets, concurrent exclusion-index reindex, unpopulated concurrent refresh, and concurrent refresh without a usable all-row unique index.

          ## Durable state and locking

          Each apply uses a session-level advisory lock scoped to the target OID. The durable ledger records `running`, `succeeded`, `failed`, or `unknown` state. A cancellation, timeout, connection loss, or status-write failure after execution begins can produce an unknown outcome; callers must reconcile rather than blindly retry.

          The adapter validates ledger ownership, persistence, relation kind, columns, RLS state, triggers, and rules before trusting stored plans. Status payloads expose identifiers, hashes, operation, target, timestamps, state, and a redacted error code—never raw SQL or database exception details.

          ## Transaction semantics

          PostgreSQL requires `VACUUM` outside a transaction block. Concurrent reindex and concurrent materialized-view refresh also have operation-specific nontransactional behavior. The adapter therefore uses an autocommit session, explicit session cleanup, bounded timeouts, target locking, durable state, and reconciliation rather than claiming rollback safety.
          '''.replace("          ", "")
          )

          readme = Path("README.md")
          content = readme.read_text()
          content = content.replace(
              "- **Reviewed migrations** — deterministic plan hashes, conservative DDL classification, atomic schema/ledger commits, and latest-only rollback.\n",
              "- **Reviewed migrations** — deterministic plan hashes, conservative DDL classification, atomic schema/ledger commits, and latest-only rollback.\n- **Reviewed maintenance** — hash-bound nontransactional plans, target locks, durable status, and explicit unknown-outcome reconciliation.\n",
              1,
          )
          content = content.replace(
              "| `rollback_migration` | Roll back the latest reviewed migration atomically in reverse order |\n",
              "| `rollback_migration` | Roll back the latest reviewed migration atomically in reverse order |\n| `create_maintenance_plan` | Inspect and hash a structured nontransactional maintenance request |\n| `apply_maintenance_plan` | Apply an exact reviewed maintenance plan; unrestricted mode only |\n| `get_maintenance_status` | Return redacted durable maintenance state |\n| `reconcile_maintenance_operation` | Resolve an unknown maintenance outcome after external verification |\n",
              1,
          )
          content = content.replace(
              "structured CRUD in [docs/data-operations.md](docs/data-operations.md), and the version support contract in [docs/compatibility.md](docs/compatibility.md).",
              "structured CRUD in [docs/data-operations.md](docs/data-operations.md), reviewed maintenance in [docs/maintenance.md](docs/maintenance.md), and the version support contract in [docs/compatibility.md](docs/compatibility.md).",
              1,
          )
          readme.write_text(content)
          PY

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Format and validate source-only changes
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/postgres_mcp/maintenance \
            src/postgres_mcp/server.py \
            tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            tests/integration/maintenance/test_maintenance_integration.py
          uv run ruff check --fix \
            src/postgres_mcp/maintenance \
            src/postgres_mcp/server.py \
            tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            tests/integration/maintenance/test_maintenance_integration.py
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q tests/unit/maintenance tests/unit/server/test_maintenance_tools.py

      - name: Commit validated source-only changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/maintenance.md src/postgres_mcp/server.py \
            src/postgres_mcp/maintenance tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            tests/integration/maintenance/test_maintenance_integration.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expose reviewed nontransactional maintenance"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/reviewed-maintenance
