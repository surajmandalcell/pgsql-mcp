name: Normalize maintenance coverage signature

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: normalize-maintenance-coverage-signature
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Normalize signature and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/postgres_mcp/maintenance/postgres.py")
          content = path.read_text()
          old = (
              "    async def _finish_record(\n"
              "        self,\n"
              "        connection: Any,\n"
              "        *,\n"
              "        name: str,\n"
              "        status: MaintenanceOperationStatus,\n"
              "        error_code: str | None,\n"
              "    ) -> dict[str, Any]:\n"
          )
          new = (
              "    async def _finish_record(self, connection: Any, *, name: str, "
              "status: MaintenanceOperationStatus, error_code: str | None) -> dict[str, Any]:\n"
          )
          if content.count(old) != 1:
              raise RuntimeError("expected exactly one maintenance finalization signature")
          path.write_text(content.replace(old, new, 1))
          PY
          rm .github/workflows/normalize-maintenance-signature.yml
          git diff --check

      - name: Commit normalized source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            src/postgres_mcp/maintenance/postgres.py \
            .github/workflows/normalize-maintenance-signature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize maintenance coverage signature"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${{ github.event.pull_request.head.ref }}
