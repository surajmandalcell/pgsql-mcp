name: PostgreSQL compatibility

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: postgres-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported-major:
    name: PostgreSQL ${{ matrix.major }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        major: ["14", "15", "16", "17", "18"]
    env:
      PGSQL_MCP_TEST_POSTGRES_IMAGE: postgres:${{ matrix.major }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Run compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pytest -v \
            tests/unit/test_postgres_matrix.py \
            tests/integration/catalog \
            tests/integration/data_ops \
            tests/integration/migrations \
            tests/integration/maintenance \
            tests/integration/replication \
            tests/integration/providers \
            --junitxml="postgres-${{ matrix.major }}-results.xml" \
            2>&1 | tee "postgres-${{ matrix.major }}-output.txt"

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-${{ matrix.major }}-compatibility
          path: |
            postgres-${{ matrix.major }}-output.txt
            postgres-${{ matrix.major }}-results.xml
          if-no-files-found: error
          retention-days: 30
