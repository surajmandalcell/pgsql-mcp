name: Server-side cursor diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: server-side-cursor-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/server-side-bounded-cursors' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Start Docker
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.6.9'

      - name: Apply implementation from transition workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-server-side-cursor.yml').read_text()
          marker = "          python - <<'PY'\n"
          source = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(dedent(source), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Normalize and validate all gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/postgres_mcp/sql/sql_driver.py \
            tests/unit/sql/test_bounded_driver.py \
            tests/unit/sql/test_bounded_server_cursor.py \
            tests/integration/sql/test_server_side_bounded_cursor.py
          uv run ruff check --fix \
            src/postgres_mcp/sql/sql_driver.py \
            tests/unit/sql/test_bounded_driver.py \
            tests/unit/sql/test_bounded_server_cursor.py \
            tests/integration/sql/test_server_side_bounded_cursor.py
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q

      - name: Commit validated source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            src/postgres_mcp/sql/sql_driver.py \
            tests/unit/sql/test_bounded_driver.py \
            tests/unit/sql/test_bounded_server_cursor.py \
            tests/integration/sql/test_server_side_bounded_cursor.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use server-side cursors for bounded reads'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/server-side-bounded-cursors
