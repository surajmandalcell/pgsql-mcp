name: Publish PostGIS catalog diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-postgis-catalog-diagnostics
  cancel-in-progress: false

jobs:
  validate-commit:
    if: github.event.pull_request.head.ref == 'feature/postgis-catalog-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Apply final source surfaces
        run: |
          python scripts/apply_postgis_source.py
          python scripts/apply_postgis_server.py
          python scripts/apply_postgis_readme.py

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Validate publishable source
        shell: bash
        run: |
          set -euo pipefail
          {
            uv run ruff format \
              scripts/apply_postgis_source.py \
              scripts/apply_postgis_server.py \
              scripts/apply_postgis_readme.py \
              src/postgres_mcp/postgis_diagnostics.py \
              src/postgres_mcp/server.py \
              tests/unit/extensions/test_postgis_diagnostics.py \
              tests/unit/extensions/test_postgis_typmod_without_srid.py \
              tests/unit/server/test_extension_profile_tools.py \
              tests/unit/server/test_postgis_diagnostic_tools.py \
              tests/integration/extensions/test_postgis_diagnostics_integration.py
            uv run ruff check --fix \
              scripts/apply_postgis_source.py \
              scripts/apply_postgis_server.py \
              scripts/apply_postgis_readme.py \
              src/postgres_mcp/postgis_diagnostics.py \
              src/postgres_mcp/server.py \
              tests/unit/extensions/test_postgis_diagnostics.py \
              tests/unit/extensions/test_postgis_typmod_without_srid.py \
              tests/unit/server/test_extension_profile_tools.py \
              tests/unit/server/test_postgis_diagnostic_tools.py \
              tests/integration/extensions/test_postgis_diagnostics_integration.py
            python scripts/check_ste_docs.py .
            uv run ruff format --check .
            uv run ruff check .
            uv run pyright
            uv run pytest -q \
              tests/unit/extensions/test_postgis_diagnostics.py \
              tests/unit/extensions/test_postgis_typmod_without_srid.py \
              tests/unit/server/test_extension_profile_tools.py \
              tests/unit/server/test_postgis_diagnostic_tools.py
            uv run pytest -q
          } 2>&1 | tee /tmp/postgis-publish-validation.txt

      - name: Capture publish diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short > /tmp/postgis-publish-status.txt
          git diff --check > /tmp/postgis-publish-diff-check.txt || true
          git diff --stat > /tmp/postgis-publish-diff-stat.txt
          git diff > /tmp/postgis-publish.diff
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=.pytest_cache \
            --exclude='**/__pycache__' \
            -czf /tmp/postgis-publish-workspace.tar.gz .

      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgis-publish-diagnostics
          path: |
            /tmp/postgis-publish-validation.txt
            /tmp/postgis-publish-status.txt
            /tmp/postgis-publish-diff-check.txt
            /tmp/postgis-publish-diff-stat.txt
            /tmp/postgis-publish.diff
            /tmp/postgis-publish-workspace.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Commit final source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            README.md \
            docs/postgis.md \
            src/postgres_mcp/postgis_diagnostics.py \
            src/postgres_mcp/server.py \
            tests/integration/extensions/test_postgis_diagnostics_integration.py \
            tests/unit/extensions/test_postgis_diagnostics.py \
            tests/unit/extensions/test_postgis_typmod_without_srid.py \
            tests/unit/server/test_extension_profile_tools.py \
            tests/unit/server/test_postgis_diagnostic_tools.py
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expose read-only PostGIS catalog diagnostics"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/postgis-catalog-diagnostics
