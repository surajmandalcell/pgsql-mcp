name: Apply reviewed transaction builder fix

on:
  push:
    branches:
      - agent/bootstrap-local-copy
    paths:
      - .github/pr6-begin-builder.patch
      - .github/workflows/pr6-review-fix.yml

permissions:
  contents: write

concurrency:
  group: pr6-review-fix
  cancel-in-progress: false

jobs:
  apply-reviewed-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-local-copy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker service
        run: sudo service docker start || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply exact reviewed patch
        run: |
          git apply --check .github/pr6-begin-builder.patch
          git apply .github/pr6-begin-builder.patch
          rm .github/pr6-begin-builder.patch .github/workflows/pr6-review-fix.yml

      - name: Validate the complete change
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -v --log-cli-level=INFO

      - name: Commit the reviewed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Route transaction startup through an allowlisted builder"
          git push origin HEAD:agent/bootstrap-local-copy
