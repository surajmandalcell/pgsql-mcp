name: Concurrency stress

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: concurrency-stress-main
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGSQL_MCP_RUN_STRESS: "1"
      PGSQL_MCP_TEST_POSTGRES_IMAGE: postgres:16

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Run pool and cancellation stress contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/integration/stress \
            --junitxml=concurrency-stress.xml \
            2>&1 | tee concurrency-stress.txt

      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: concurrency-stress-evidence
          path: |
            concurrency-stress.txt
            concurrency-stress.xml
          if-no-files-found: error
          retention-days: 30
