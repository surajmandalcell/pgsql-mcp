name: Test quality

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-quality-main
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Run branch coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run --with 'coverage[toml]>=7.6,<8' coverage run \
            --branch \
            --source=postgres_mcp \
            -m pytest -q \
            2>&1 | tee coverage-pytest.txt
          uv run --with 'coverage[toml]>=7.6,<8' coverage report -m | tee coverage-report.txt
          uv run --with 'coverage[toml]>=7.6,<8' coverage report -m \
            --include='src/postgres_mcp/sql/*,src/postgres_mcp/migrations/*,src/postgres_mcp/data_ops/*' \
            | tee critical-coverage-report.txt
          uv run --with 'coverage[toml]>=7.6,<8' coverage report -m \
            --fail-under=100 \
            --include='src/postgres_mcp/runtime.py,src/postgres_mcp/sql/query_guard.py,src/postgres_mcp/sql/results.py,src/postgres_mcp/sql/transaction.py,src/postgres_mcp/migrations/service.py,src/postgres_mcp/data_ops/service.py' \
            | tee safety-kernel-coverage-report.txt
          uv run --with 'coverage[toml]>=7.6,<8' coverage xml -o coverage.xml
          uv run --with 'coverage[toml]>=7.6,<8' coverage json -o coverage.json

      - name: Enforce changed-line coverage
        if: github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        env:
          PREVIOUS_MAIN_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git branch coverage-base "$PREVIOUS_MAIN_SHA"
          uv run --with 'diff-cover>=9,<10' diff-cover coverage.xml \
            --compare-branch=coverage-base \
            --fail-under=100 \
            --html-report diff-coverage.html \
            | tee diff-coverage.txt

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-quality-diagnostics
          path: |
            .coverage
            coverage-pytest.txt
            coverage-report.txt
            critical-coverage-report.txt
            safety-kernel-coverage-report.txt
            coverage.xml
            coverage.json
            diff-coverage.txt
            diff-coverage.html
          if-no-files-found: warn
          retention-days: 30
