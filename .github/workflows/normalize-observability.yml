name: Normalize runtime observability source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: normalize-runtime-observability
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'feature/runtime-observability' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.6.9'

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Apply exact static-type and contract fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              if source.count(old) != 1:
                  raise RuntimeError(f'expected exactly one match in {path}: {old!r}')
              target.write_text(source.replace(old, new, 1))

          replace_once(
              'src/postgres_mcp/observability.py',
              '''    if getattr(server, "_pgsql_mcp_observability_installed", False):
                  return server
              original_call = server.call_tool
          ''',
              '''    server_object: Any = server
              if getattr(server_object, "_pgsql_mcp_observability_installed", False):
                  return server
              original_call = server.call_tool
          ''',
          )
          replace_once(
              'src/postgres_mcp/observability.py',
              '''    setattr(server, "call_tool", observed_call)
              setattr(server, "_pgsql_mcp_observability_installed", True)
          ''',
              '''    setattr(server_object, "call_tool", observed_call)
              setattr(server_object, "_pgsql_mcp_observability_installed", True)
          ''',
          )
          replace_once(
              'src/postgres_mcp/observability.py',
              '            def log_message(self, format_string: str, *args: Any) -> None:\n',
              '            def log_message(self, format: str, *args: Any) -> None:\n',
          )

          replace_once(
              'tests/unit/observability/test_observability.py',
              'from typing import Any\n',
              'from typing import Any\nfrom typing import cast\n',
          )
          replace_once(
              'tests/unit/observability/test_observability.py',
              'from postgres_mcp.observability import ToolOutcome\n',
              'from postgres_mcp.observability import ToolCallServer\nfrom postgres_mcp.observability import ToolOutcome\n',
          )
          for name in ('server', 'failing_server', 'cancelled_server'):
              callback = {'server': 'success', 'failing_server': 'failure', 'cancelled_server': 'cancelled'}[name]
              replace_once(
                  'tests/unit/observability/test_observability.py',
                  f'    {name} = SimpleNamespace(call_tool={callback})\n',
                  f'    {name} = cast(ToolCallServer, SimpleNamespace(call_tool={callback}))\n',
              )
          replace_once(
              'tests/unit/observability/test_observability.py',
              '    assert rendered.count("pgsql_mcp_tool_duration_seconds_count") == 2\n',
              '    assert rendered.count("pgsql_mcp_tool_duration_seconds_count") == 1\n',
          )
          PY

      - name: Normalize source
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/postgres_mcp/__init__.py \
            src/postgres_mcp/observability.py \
            src/postgres_mcp/observed_server.py \
            tests/unit/observability
          uv run ruff check --fix \
            src/postgres_mcp/__init__.py \
            src/postgres_mcp/observability.py \
            src/postgres_mcp/observed_server.py \
            tests/unit/observability

      - name: Validate normalized source
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee /tmp/observability-ruff-format.txt
          format_status=${PIPESTATUS[0]}
          uv run ruff check . 2>&1 | tee /tmp/observability-ruff-check.txt
          lint_status=${PIPESTATUS[0]}
          uv run pyright 2>&1 | tee /tmp/observability-pyright.txt
          pyright_status=${PIPESTATUS[0]}
          uv run pytest -q tests/unit/observability 2>&1 | tee /tmp/observability-pytest.txt
          pytest_status=${PIPESTATUS[0]}
          printf 'format=%s\nlint=%s\npyright=%s\npytest=%s\n' \
            "$format_status" "$lint_status" "$pyright_status" "$pytest_status" \
            | tee /tmp/observability-status.txt
          if [ "$format_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || \
             [ "$pyright_status" -ne 0 ] || [ "$pytest_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload normalization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observability-normalization-evidence
          path: |
            /tmp/observability-ruff-format.txt
            /tmp/observability-ruff-check.txt
            /tmp/observability-pyright.txt
            /tmp/observability-pytest.txt
            /tmp/observability-status.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Commit normalized source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            docs/observability.md \
            src/postgres_mcp/__init__.py \
            src/postgres_mcp/observability.py \
            src/postgres_mcp/observed_server.py \
            tests/unit/observability
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize runtime observability source'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/runtime-observability
