name: Normalize runtime observability source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: normalize-runtime-observability
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'feature/runtime-observability' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.6.9'

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Normalize and validate
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/postgres_mcp/__init__.py \
            src/postgres_mcp/observability.py \
            src/postgres_mcp/observed_server.py \
            tests/unit/observability
          uv run ruff check --fix \
            src/postgres_mcp/__init__.py \
            src/postgres_mcp/observability.py \
            src/postgres_mcp/observed_server.py \
            tests/unit/observability
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q tests/unit/observability

      - name: Commit normalized source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            docs/observability.md \
            src/postgres_mcp/__init__.py \
            src/postgres_mcp/observability.py \
            src/postgres_mcp/observed_server.py \
            tests/unit/observability
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize runtime observability source'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/runtime-observability
