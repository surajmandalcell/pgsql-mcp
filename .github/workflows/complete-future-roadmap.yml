# This temporary workflow materializes the verified roadmap source on main.
name: Complete future roadmap

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: complete-future-roadmap-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Materialize verified roadmap source
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/future_roadmap_parts/part*.txt | tr -d '\n' | base64 -d > scripts/apply_future_roadmap.py
          python -m py_compile scripts/apply_future_roadmap.py
          python scripts/apply_future_roadmap.py
          python -m compileall -q src/postgres_mcp tests/unit

      - name: Publish final source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/future_roadmap_parts
          rm -f scripts/apply_future_roadmap.py
          rm -f roadmap-mutation-results.json
          rm -f docs/roadmap-merge-trigger*.md
          rm -f docs/roadmap-publisher-merge-event.md
          rm -f .github/workflows/complete-future-roadmap.yml
          rm -f .github/workflows/roadmap-ci-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete future roadmap"
          git push origin HEAD:main
