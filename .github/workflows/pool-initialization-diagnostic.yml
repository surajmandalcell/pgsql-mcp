name: Pool initialization diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pool-initialization-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'fix/concurrent-pool-initialization' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Apply initialization lock
        run: python scripts/apply_pool_initialization_lock.py

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Normalize and capture gates
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run ruff format scripts/apply_pool_initialization_lock.py src/postgres_mcp/sql/sql_driver.py tests/unit/sql/test_pool_lifecycle.py 2>&1 | tee /tmp/ruff-format.txt
          uv run ruff check --fix scripts/apply_pool_initialization_lock.py src/postgres_mcp/sql/sql_driver.py tests/unit/sql/test_pool_lifecycle.py 2>&1 | tee /tmp/ruff-fix.txt
          uv run ruff format --check . 2>&1 | tee /tmp/ruff-format-check.txt
          format_status=${PIPESTATUS[0]}
          uv run ruff check . 2>&1 | tee /tmp/ruff-check.txt
          lint_status=${PIPESTATUS[0]}
          uv run pyright 2>&1 | tee /tmp/pyright.txt
          pyright_status=${PIPESTATUS[0]}
          uv run pytest -q tests/unit/sql/test_pool_lifecycle.py 2>&1 | tee /tmp/focused-pytest.txt
          focused_status=${PIPESTATUS[0]}
          uv run pytest -q --junitxml=/tmp/pytest.xml 2>&1 | tee /tmp/pytest.txt
          pytest_status=${PIPESTATUS[0]}
          printf 'format=%s\nlint=%s\npyright=%s\nfocused=%s\npytest=%s\n' \
            "$format_status" "$lint_status" "$pyright_status" "$focused_status" "$pytest_status" \
            | tee /tmp/status.txt
          tar --exclude=.git --exclude=.venv --exclude=.pytest_cache --exclude='**/__pycache__' -czf /tmp/workspace.tar.gz .
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-initialization-diagnostics
          path: |
            /tmp/ruff-format.txt
            /tmp/ruff-fix.txt
            /tmp/ruff-format-check.txt
            /tmp/ruff-check.txt
            /tmp/pyright.txt
            /tmp/focused-pytest.txt
            /tmp/pytest.txt
            /tmp/pytest.xml
            /tmp/status.txt
            /tmp/workspace.tar.gz
          if-no-files-found: error
          retention-days: 7
