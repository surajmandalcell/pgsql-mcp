name: Finalize reviewed migration source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: finalize-reviewed-migration-source
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Reconstruct the already validated source tree
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/reviewed-migrations.patch.gz.b64
          for index in $(seq -w 0 28); do
            cat ".github/transfer/reviewed-migrations-clean/part0${index}" >> /tmp/reviewed-migrations.patch.gz.b64
          done
          test "$(wc -c < /tmp/reviewed-migrations.patch.gz.b64)" -eq 57776
          test "$(sha256sum /tmp/reviewed-migrations.patch.gz.b64 | cut -d' ' -f1)" = "4a8a11a64a962bb486e06c0ab7627468f13e16089a094113af0b5522c3810c0d"
          base64 --decode /tmp/reviewed-migrations.patch.gz.b64 > /tmp/reviewed-migrations.patch.gz
          test "$(wc -c < /tmp/reviewed-migrations.patch.gz)" -eq 43331
          test "$(sha256sum /tmp/reviewed-migrations.patch.gz | cut -d' ' -f1)" = "682ab9b62dba807d8b3632c66a085f94e772b2666ef66f5d82be20efaf99292a"
          gzip --decompress --stdout /tmp/reviewed-migrations.patch.gz > /tmp/reviewed-migrations.patch
          test "$(wc -c < /tmp/reviewed-migrations.patch)" -eq 121832
          test "$(sha256sum /tmp/reviewed-migrations.patch | cut -d' ' -f1)" = "86d66ee2d482989fc97b817e3a0f006a8cf90496a11c2f1537287e08784ed283"
          git apply --check /tmp/reviewed-migrations.patch
          git apply /tmp/reviewed-migrations.patch

      - name: Apply deterministic formatting normalizations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contributing = Path("CONTRIBUTING.md")
          contributing.write_text(contributing.read_text().rstrip() + "\n")

          test_path = Path("tests/unit/server/test_migration_tools.py")
          content = test_path.read_text()
          old = (
              "from postgres_mcp.migrations import MigrationOperationStatus\n"
              "from postgres_mcp.migrations import MigrationStatusSnapshot\n"
              "from postgres_mcp.migrations import MigrationStepDraft\n"
              "from postgres_mcp.migrations import MigrationPlanner\n"
          )
          new = (
              "from postgres_mcp.migrations import MigrationOperationStatus\n"
              "from postgres_mcp.migrations import MigrationPlanner\n"
              "from postgres_mcp.migrations import MigrationStatusSnapshot\n"
              "from postgres_mcp.migrations import MigrationStepDraft\n"
          )
          if content.count(old) != 1:
              raise RuntimeError("unexpected migration test import block")
          test_path.write_text(content.replace(old, new, 1))
          PY

      - name: Remove transfer-only artifacts and verify the final diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/transfer/reviewed-migrations-clean
          rm -rf .github/transfer/reviewed-migrations
          rm -f .github/workflows/apply-reviewed-migrations-clean.yml
          rm -f .github/workflows/apply-reviewed-migrations.yml
          rm -f .github/workflows/export-reviewed-migrations-workspace.yml
          git add -A
          git diff --cached --check
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit the validated source-only bounded context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement reviewed atomic migrations"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/reviewed-migrations
