name: Trim unreachable observability branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trim:
    if: github.event.pull_request.head.ref == 'feature/runtime-observability' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.6.9'
      - name: Remove logically unreachable check
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/postgres_mcp/observability.py')
          source = path.read_text()
          old = '''        if not isinstance(payload, dict):
              continue
          '''
          if source.count(old) != 1:
              raise RuntimeError('expected one redundant JSON object check')
          path.write_text(source.replace(old, '', 1))
          PY
      - name: Validate
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q tests/unit/observability
      - name: Commit source correction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add src/postgres_mcp/observability.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove unreachable observability branch'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/runtime-observability
