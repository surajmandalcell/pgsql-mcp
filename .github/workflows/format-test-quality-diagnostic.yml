name: Format test-quality diagnostic

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: format-test-quality-diagnostic
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Normalize and capture diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run ruff format . 2>&1 | tee /tmp/ruff-format.txt
          uv run ruff check --fix . 2>&1 | tee /tmp/ruff-fix.txt
          uv run ruff format --check . 2>&1 | tee /tmp/ruff-format-check.txt
          uv run ruff check . 2>&1 | tee /tmp/ruff-check.txt
          uv run pyright 2>&1 | tee /tmp/pyright.txt
          pyright_status=${PIPESTATUS[0]}
          uv run pytest -q \
            tests/unit/sql/test_safety_kernel_edges.py \
            tests/unit/migrations/test_migration_service_defaults.py \
            tests/unit/migrations/test_migration_domain_edges.py \
            tests/unit/migrations/test_migration_policy_edges.py \
            tests/unit/migrations/test_postgres_backend_edges.py \
            2>&1 | tee /tmp/focused-pytest.txt
          pytest_status=${PIPESTATUS[0]}
          printf 'pyright=%s\npytest=%s\n' "$pyright_status" "$pytest_status" | tee /tmp/status.txt
          tar --exclude=.git --exclude=.venv --exclude=.pytest_cache --exclude='**/__pycache__' \
            -czf /tmp/normalized-workspace.tar.gz .

      - name: Upload normalized workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-quality-ruff-normalized
          path: |
            /tmp/ruff-format.txt
            /tmp/ruff-fix.txt
            /tmp/ruff-format-check.txt
            /tmp/ruff-check.txt
            /tmp/pyright.txt
            /tmp/focused-pytest.txt
            /tmp/status.txt
            /tmp/normalized-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
