name: Normalize mutation safety source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: normalize-mutation-safety-source
  cancel-in-progress: false

jobs:
  normalize-validate-commit:
    if: github.event.pull_request.head.ref == 'feature/mutation-safety-kernel' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Normalize mutation source
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/mutation tests/unit/mutation tests/unit/sql/test_results.py
          uv run ruff check --fix tests/mutation tests/unit/mutation tests/unit/sql/test_results.py

      - name: Validate complete source and mutation gate
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q tests/unit/mutation/test_safety_mutations.py tests/unit/sql/test_results.py
          uv run python tests/mutation/safety_mutations.py --output /tmp/mutation-results.json --timeout-seconds 180

      - name: Commit exact normalized source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-mutation-source.yml
          git add -A -- \
            .github/workflows/normalize-mutation-source.yml \
            tests/mutation \
            tests/unit/mutation \
            tests/unit/sql/test_results.py
          git diff --cached --check
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize safety mutation contracts"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/mutation-safety-kernel
