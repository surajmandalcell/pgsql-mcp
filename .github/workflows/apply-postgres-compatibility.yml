name: Apply PostgreSQL compatibility matrix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-postgres-compatibility
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Add test-first compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match in {path}, found {count}")
              target.write_text(content.replace(old, new, 1))

          replace_once(
              "tests/utils.py",
              "from typing import Generator\nfrom typing import Tuple\n",
              "from typing import Generator\nfrom typing import Mapping\nfrom typing import Tuple\n",
          )
          replace_once(
              "tests/utils.py",
              '''logger = logging.getLogger(__name__)\n\n\ndef create_postgres_container''',
              '''logger = logging.getLogger(__name__)\n\nPOSTGRES_IMAGE_ENV = "PGSQL_MCP_TEST_POSTGRES_IMAGE"\nSUPPORTED_POSTGRES_IMAGES = tuple(f"postgres:{major}" for major in range(14, 19))\nDEFAULT_POSTGRES_IMAGES = ("postgres:15", "postgres:16")\n\n\ndef configured_postgres_images(environment: Mapping[str, str] | None = None) -> tuple[str, ...]:\n    """Return the validated PostgreSQL image selection for integration tests."""\n    source = os.environ if environment is None else environment\n    configured = source.get(POSTGRES_IMAGE_ENV)\n    if configured is None or not configured.strip():\n        return DEFAULT_POSTGRES_IMAGES\n\n    image = configured.strip()\n    if image not in SUPPORTED_POSTGRES_IMAGES:\n        choices = ", ".join(SUPPORTED_POSTGRES_IMAGES)\n        raise RuntimeError(f"{POSTGRES_IMAGE_ENV} must be one of: {choices}")\n    return (image,)\n\n\ndef create_postgres_container''',
          )

          replace_once(
              "tests/conftest.py",
              "from utils import create_postgres_container\n",
              "from utils import configured_postgres_images\nfrom utils import create_postgres_container\n",
          )
          replace_once(
              "tests/conftest.py",
              '@pytest.fixture(scope="class", params=["postgres:15", "postgres:16"])',
              '@pytest.fixture(scope="class", params=configured_postgres_images())',
          )

          replace_once(
              "tests/integration/catalog/test_catalog_advanced_integration.py",
              'assert server["server_version_num"] >= 150000',
              'assert server["server_version_num"] >= 140000',
          )
          replace_once(
              "tests/integration/data_ops/test_data_ops_integration.py",
              '"""PostgreSQL 15/16 integration contracts for typed guarded data operations."""',
              '"""Supported-PostgreSQL integration contracts for typed guarded data operations."""',
          )
          replace_once(
              "tests/integration/migrations/test_reviewed_migrations_integration.py",
              '"""Real PostgreSQL 15/16 contracts for reviewed atomic migrations."""',
              '"""Supported-PostgreSQL contracts for reviewed atomic migrations."""',
          )

          Path("tests/unit/test_postgres_matrix.py").write_text(
              '''"""Contracts for deterministic PostgreSQL compatibility test selection."""\n\nfrom __future__ import annotations\n\nimport pytest\n\nfrom utils import DEFAULT_POSTGRES_IMAGES\nfrom utils import POSTGRES_IMAGE_ENV\nfrom utils import SUPPORTED_POSTGRES_IMAGES\nfrom utils import configured_postgres_images\n\n\ndef test_matrix_defaults_to_the_fast_pull_request_pair() -> None:\n    assert configured_postgres_images({}) == DEFAULT_POSTGRES_IMAGES\n    assert DEFAULT_POSTGRES_IMAGES == ("postgres:15", "postgres:16")\n\n\n@pytest.mark.parametrize("image", SUPPORTED_POSTGRES_IMAGES)\ndef test_matrix_accepts_each_supported_major(image: str) -> None:\n    assert configured_postgres_images({POSTGRES_IMAGE_ENV: image}) == (image,)\n\n\ndef test_matrix_trims_the_configured_image() -> None:\n    assert configured_postgres_images({POSTGRES_IMAGE_ENV: "  postgres:18  "}) == ("postgres:18",)\n\n\ndef test_matrix_rejects_unadvertised_images() -> None:\n    with pytest.raises(RuntimeError, match=POSTGRES_IMAGE_ENV):\n        configured_postgres_images({POSTGRES_IMAGE_ENV: "postgres:13"})\n'''
          )

          Path(".github/workflows/postgres-compatibility.yml").write_text(
              '''name: PostgreSQL compatibility\n\non:\n  push:\n    branches:\n      - main\n  pull_request:\n    types:\n      - opened\n      - synchronize\n      - reopened\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: postgres-compatibility-${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  supported-major:\n    name: PostgreSQL ${{ matrix.major }}\n    runs-on: ubuntu-latest\n    timeout-minutes: 35\n    strategy:\n      fail-fast: false\n      matrix:\n        major: ["14", "15", "16", "17", "18"]\n    env:\n      PGSQL_MCP_TEST_POSTGRES_IMAGE: postgres:${{ matrix.major }}\n\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262\n\n      - name: Set up Python\n        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065\n        with:\n          python-version: "3.12"\n\n      - name: Start and verify Docker\n        shell: bash\n        run: |\n          set -euo pipefail\n          sudo service docker start || true\n          docker info\n\n      - name: Install uv\n        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86\n        with:\n          version: "0.6.9"\n\n      - name: Install complete dependency set\n        run: uv sync --frozen --all-extras\n\n      - name: Run compatibility contracts\n        shell: bash\n        run: |\n          set -euo pipefail\n          set -o pipefail\n          uv run pytest -v \\\n            tests/integration/catalog \\\n            tests/integration/data_ops \\\n            tests/integration/migrations \\\n            --junitxml="postgres-${{ matrix.major }}-results.xml" \\\n            2>&1 | tee "postgres-${{ matrix.major }}-output.txt"\n\n      - name: Upload compatibility diagnostics\n        if: always()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n        with:\n          name: postgresql-${{ matrix.major }}-compatibility\n          path: |\n            postgres-${{ matrix.major }}-output.txt\n            postgres-${{ matrix.major }}-results.xml\n          if-no-files-found: error\n'''
          )

          Path("docs/compatibility.md").write_text(
              '''# PostgreSQL compatibility\n\n`pgsql-mcp` treats PostgreSQL capabilities and live catalogs as the source of truth. The release gate currently exercises the core catalog, typed-data, and reviewed-migration bounded contexts against PostgreSQL 14, 15, 16, 17, and 18.\n\n## Support contract\n\n- The supported-major matrix follows PostgreSQL's upstream-supported release window.\n- A major version is not advertised until its matrix job passes the same real-database contracts.\n- End-of-life majors are best effort and do not block security or catalog improvements.\n- PostgreSQL-compatible products are separate adapters unless their catalogs, types, transactions, and error behavior pass the same contracts.\n\nThe ordinary pull-request suite keeps PostgreSQL 15 and 16 as its fast pair. The dedicated matrix independently runs the catalog, typed-data, and migration integration suites on every supported major. Set `PGSQL_MCP_TEST_POSTGRES_IMAGE=postgres:<major>` to reproduce one matrix cell locally. Invalid or unadvertised image values fail during test collection instead of silently weakening coverage.\n\n## Deployment tiers\n\nSelf-hosted PostgreSQL over TCP or Unix sockets is the guaranteed baseline. Managed services generally work when they preserve the required PostgreSQL catalogs and transaction behavior, but provider-specific administration restrictions are discovered at runtime and may disable individual capabilities.\n\nThe test image installs `pg_stat_statements` and HypoPG because query-plan and index-analysis contracts use them. Other extensions such as PostGIS, TimescaleDB, Citus, and pgvector require their own compatibility profiles before they can be described as fully tested.\n\n## Adding a PostgreSQL major\n\n1. Add the image to `SUPPORTED_POSTGRES_IMAGES`.\n2. Add the major to `.github/workflows/postgres-compatibility.yml`.\n3. Run the complete compatibility matrix.\n4. Resolve catalog or SQL differences through capability detection rather than version-brand branching where possible.\n5. Update this document only after every required matrix cell is green.\n'''
          )

          replace_once(
              "README.md",
              "- **Typed data operations** — structured filters, keyset pagination, live catalog validation, and rollback-enforced mutation ceilings.\n",
              "- **Typed data operations** — structured filters, keyset pagination, live catalog validation, and rollback-enforced mutation ceilings.\n- **Version compatibility** — core catalog, typed-data, and migration contracts exercised across PostgreSQL 14–18.\n",
          )
          replace_once(
              "README.md",
              "## Optional PostgreSQL extensions\n",
              '''## PostgreSQL compatibility\n\nThe dedicated compatibility matrix exercises the catalog, typed-data, and reviewed-migration bounded contexts against PostgreSQL 14, 15, 16, 17, and 18. The ordinary pull-request suite retains PostgreSQL 15 and 16 as its fast pair. See [docs/compatibility.md](docs/compatibility.md) for the support contract, local reproduction, and deployment tiers.\n\n## Optional PostgreSQL extensions\n''',
          )
          replace_once(
              "README.md",
              "and structured CRUD in [docs/data-operations.md](docs/data-operations.md).",
              "structured CRUD in [docs/data-operations.md](docs/data-operations.md), and the version support contract in [docs/compatibility.md](docs/compatibility.md).",
          )
          PY

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Format and validate the complete repository
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -v --log-cli-level=INFO

      - name: Remove temporary workflow and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-postgres-compatibility.yml
          git add -A
          git diff --cached --check
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --name-only | sort > /tmp/actual-files
          allowed='^(\.github/workflows/(apply-postgres-compatibility|postgres-compatibility)\.yml|README\.md|docs/compatibility\.md|tests/conftest\.py|tests/integration/catalog/test_catalog_advanced_integration\.py|tests/integration/data_ops/test_data_ops_integration\.py|tests/integration/migrations/test_reviewed_migrations_integration\.py|tests/unit/test_postgres_matrix\.py|tests/utils\.py)$'
          unexpected=$(grep -Ev "$allowed" /tmp/actual-files || true)
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected changed files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test "$(wc -l < /tmp/actual-files)" -eq 10

      - name: Commit validated compatibility slice
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add PostgreSQL 14-18 compatibility matrix"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/postgres-compatibility-matrix
