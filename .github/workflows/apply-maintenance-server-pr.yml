name: Apply reviewed maintenance source bundle

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-reviewed-maintenance-source-bundle
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect source bundle
        id: source_bundle
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.maintenance-transfer/part-*' >/dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.source_bundle.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.source_bundle.outputs.present == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Verify and extract exact source bundle
        if: steps.source_bundle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .maintenance-transfer/part-* > /tmp/maintenance-source.tar.gz.b64
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          encoded = Path("/tmp/maintenance-source.tar.gz.b64").read_bytes()
          if hashlib.sha256(encoded).hexdigest() != "76d5ed8657925962fe751b81bbe55a8d9c8324b912302902ccba5323dabd1f15":
              raise RuntimeError("maintenance source bundle text checksum mismatch")

          archive = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(archive).hexdigest() != "6ddfdc1c3a0afe5216f698048368c1e395f6f683bfde2b80624377365b220a50":
              raise RuntimeError("maintenance source bundle archive checksum mismatch")

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as source:
              for member in source.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise RuntimeError(f"unsafe maintenance bundle path: {member.name!r}")
                  if member.issym() or member.islnk():
                      raise RuntimeError(f"links are not permitted in maintenance bundle: {member.name!r}")
              source.extractall(".", filter="data")
          PY
          rm -f \
            tests/unit/maintenance/test_domain.py \
            tests/unit/maintenance/test_postgres.py \
            tests/unit/maintenance/test_service.py

          # A successful REINDEX CONCURRENTLY replaces the index relation and OID.
          # Exact-plan replay must consult the durable success record before
          # revalidating the now-replaced live target.
          python - <<'PY'
          from pathlib import Path

          backend_path = Path("src/postgres_mcp/maintenance/postgres.py")
          backend = backend_path.read_text()
          old_backend = '''                        snapshot = await self._inspect_on_connection(connection, plan.target)
                        self._verify_snapshot(plan, snapshot)
                        await self._ensure_ledger(connection)
                        await self._validate_ledger(connection)
                        existing = await self._get_by_name(connection, plan.name)
                        if existing is not None:
                            stored_plan = self._verified_plan(existing)
                            if stored_plan.review_hash != plan.review_hash:
                                raise MaintenanceConflictError(
                                    f"maintenance operation {plan.name!r} already exists with different reviewed content"
                                )
                            existing_status = MaintenanceOperationStatus(str(existing["status"]))
                            if existing_status in _TERMINAL_SUCCESS:
                                return MaintenanceOperationResult(
                                    MaintenanceOperationStatus.ALREADY_SUCCEEDED,
                                    _record_from_row(existing),
                                )
                            if existing_status in {
                                MaintenanceOperationStatus.RUNNING,
                                MaintenanceOperationStatus.UNKNOWN,
                            }:
                                raise MaintenanceConflictError(
                                    f"maintenance operation {plan.name!r} has an unresolved outcome"
                                )
                            active_row = await self._restart_record(connection, plan)
                        else:
                            active_row = await self._insert_running_record(connection, plan)
'''
          new_backend = '''                        ledger_exists = await self._ledger_exists(connection)
                        existing: dict[str, Any] | None = None
                        if ledger_exists:
                            await self._validate_ledger(connection)
                            existing = await self._get_by_name(connection, plan.name)
                            if existing is not None:
                                stored_plan = self._verified_plan(existing)
                                if stored_plan.review_hash != plan.review_hash:
                                    raise MaintenanceConflictError(
                                        f"maintenance operation {plan.name!r} already exists with different reviewed content"
                                    )
                                existing_status = MaintenanceOperationStatus(str(existing["status"]))
                                if existing_status in _TERMINAL_SUCCESS:
                                    return MaintenanceOperationResult(
                                        MaintenanceOperationStatus.ALREADY_SUCCEEDED,
                                        _record_from_row(existing),
                                    )
                                if existing_status in {
                                    MaintenanceOperationStatus.RUNNING,
                                    MaintenanceOperationStatus.UNKNOWN,
                                }:
                                    raise MaintenanceConflictError(
                                        f"maintenance operation {plan.name!r} has an unresolved outcome"
                                    )

                        snapshot = await self._inspect_on_connection(connection, plan.target)
                        self._verify_snapshot(plan, snapshot)
                        if not ledger_exists:
                            await self._ensure_ledger(connection)
                            await self._validate_ledger(connection)
                        if existing is not None:
                            active_row = await self._restart_record(connection, plan)
                        else:
                            active_row = await self._insert_running_record(connection, plan)
'''
          if backend.count(old_backend) != 1:
              raise RuntimeError("expected exactly one maintenance apply block to patch")
          backend_path.write_text(backend.replace(old_backend, new_backend, 1))

          test_path = Path("tests/unit/maintenance/test_maintenance_postgres.py")
          tests = test_path.read_text()
          old_test = '''    result = await adapter.apply(plan, timeout_seconds=30, lock_timeout_seconds=5)

    assert result.status is MaintenanceOperationStatus.ALREADY_SUCCEEDED
    cursor.execute.assert_not_awaited()
    finish.assert_not_awaited()
'''
          new_test = '''    inspect = AsyncMock(return_value=snapshot(oid=99))
    monkeypatch.setattr(adapter, "_inspect_on_connection", inspect)

    result = await adapter.apply(plan, timeout_seconds=30, lock_timeout_seconds=5)

    assert result.status is MaintenanceOperationStatus.ALREADY_SUCCEEDED
    inspect.assert_not_awaited()
    cursor.execute.assert_not_awaited()
    finish.assert_not_awaited()
'''
          if tests.count(old_test) != 1:
              raise RuntimeError("expected exactly one maintenance idempotency test block to patch")
          test_path.write_text(tests.replace(old_test, new_test, 1))
          PY

      - name: Install dependencies
        if: steps.source_bundle.outputs.present == 'true'
        run: uv sync --frozen --all-extras

      - name: Validate complete source
        if: steps.source_bundle.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          set -o pipefail

          uv run ruff format --check . 2>&1 | tee /tmp/maintenance-ruff-format.txt
          format_status=${PIPESTATUS[0]}

          uv run ruff check . 2>&1 | tee /tmp/maintenance-ruff-check.txt
          lint_status=${PIPESTATUS[0]}

          uv run pyright 2>&1 | tee /tmp/maintenance-pyright.txt
          pyright_status=${PIPESTATUS[0]}

          uv run pytest -q --junitxml=/tmp/maintenance-pytest.xml 2>&1 | tee /tmp/maintenance-pytest.txt
          pytest_status=${PIPESTATUS[0]}

          printf 'format=%s\nlint=%s\npyright=%s\npytest=%s\n' \
            "$format_status" "$lint_status" "$pyright_status" "$pytest_status" \
            | tee /tmp/maintenance-validation-status.txt

          if (( format_status != 0 || lint_status != 0 || pyright_status != 0 || pytest_status != 0 )); then
            exit 1
          fi

      - name: Upload maintenance validation evidence
        if: always() && steps.source_bundle.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-maintenance-source-validation
          path: |
            /tmp/maintenance-ruff-format.txt
            /tmp/maintenance-ruff-check.txt
            /tmp/maintenance-pyright.txt
            /tmp/maintenance-pytest.txt
            /tmp/maintenance-pytest.xml
            /tmp/maintenance-validation-status.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Commit exact validated source bundle
        if: steps.source_bundle.outputs.present == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance-transfer
          git add -A -- \
            README.md \
            docs/compatibility.md \
            docs/maintenance.md \
            src/postgres_mcp/lite_server.py \
            src/postgres_mcp/maintenance \
            src/postgres_mcp/server.py \
            tests/integration/maintenance \
            tests/unit/lite/test_lite_server.py \
            tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            .maintenance-transfer
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete reviewed nontransactional maintenance"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${{ github.event.pull_request.head.ref }}
