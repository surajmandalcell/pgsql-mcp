name: Apply reviewed maintenance source bundle

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-reviewed-maintenance-source-bundle
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Verify and apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .maintenance-transfer/part-* > /tmp/maintenance.patch.gz.b64
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          encoded = Path('/tmp/maintenance.patch.gz.b64').read_text()
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != '009316e75201f5eb1112dcffd97f774aa3add2cf27b297a571dc515ec40bcb25':
              raise RuntimeError('compressed maintenance patch checksum mismatch')
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != 'e0821bc914e01f7cb7367057494adc8f1a395db3f8f61010d3237c91bda35923':
              raise RuntimeError('maintenance patch checksum mismatch')
          Path('/tmp/maintenance.patch').write_bytes(patch)
          PY
          git apply --check /tmp/maintenance.patch
          git apply /tmp/maintenance.patch

      - name: Install dependencies and validate complete source
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q

      - name: Commit exact validated source bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance-transfer
          git add -A \
            README.md \
            docs/compatibility.md \
            docs/maintenance.md \
            src/postgres_mcp/lite_server.py \
            src/postgres_mcp/maintenance \
            src/postgres_mcp/server.py \
            tests/integration/maintenance \
            tests/unit/lite/test_lite_server.py \
            tests/unit/maintenance \
            .maintenance-transfer
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete reviewed nontransactional maintenance"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/reviewed-maintenance
