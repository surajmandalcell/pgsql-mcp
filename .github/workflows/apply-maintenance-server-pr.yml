name: Apply reviewed maintenance source bundle

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-reviewed-maintenance-source-bundle
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect source bundle
        id: source_bundle
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.maintenance-transfer/part-*' >/dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.source_bundle.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.source_bundle.outputs.present == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Extract reviewed source and apply replay invariant
        if: steps.source_bundle.outputs.present == 'true'
        run: python .maintenance-transfer/source_transition.py

      - name: Install dependencies
        if: steps.source_bundle.outputs.present == 'true'
        run: uv sync --frozen --all-extras

      - name: Validate complete source
        if: steps.source_bundle.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee /tmp/maintenance-ruff-format.txt
          format_status=${PIPESTATUS[0]}
          uv run ruff check . 2>&1 | tee /tmp/maintenance-ruff-check.txt
          lint_status=${PIPESTATUS[0]}
          uv run pyright 2>&1 | tee /tmp/maintenance-pyright.txt
          pyright_status=${PIPESTATUS[0]}
          uv run pytest -q --junitxml=/tmp/maintenance-pytest.xml 2>&1 | tee /tmp/maintenance-pytest.txt
          pytest_status=${PIPESTATUS[0]}
          printf 'format=%s\nlint=%s\npyright=%s\npytest=%s\n' \
            "$format_status" "$lint_status" "$pyright_status" "$pytest_status" \
            | tee /tmp/maintenance-validation-status.txt
          if (( format_status != 0 || lint_status != 0 || pyright_status != 0 || pytest_status != 0 )); then
            exit 1
          fi

      - name: Upload maintenance validation evidence
        if: always() && steps.source_bundle.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-maintenance-source-validation
          path: |
            /tmp/maintenance-ruff-format.txt
            /tmp/maintenance-ruff-check.txt
            /tmp/maintenance-pyright.txt
            /tmp/maintenance-pytest.txt
            /tmp/maintenance-pytest.xml
            /tmp/maintenance-validation-status.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Commit exact validated source bundle
        if: steps.source_bundle.outputs.present == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance-transfer
          git add -A -- \
            README.md \
            docs/compatibility.md \
            docs/maintenance.md \
            src/postgres_mcp/lite_server.py \
            src/postgres_mcp/maintenance \
            src/postgres_mcp/server.py \
            tests/integration/maintenance \
            tests/unit/lite/test_lite_server.py \
            tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            .maintenance-transfer
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete reviewed nontransactional maintenance"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${{ github.event.pull_request.head.ref }}
