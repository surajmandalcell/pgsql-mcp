name: Apply reviewed maintenance source bundle

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-reviewed-maintenance-source-bundle
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Verify and extract exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .maintenance-transfer/part-* > /tmp/maintenance-source.tar.gz.b64
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          encoded_path = Path("/tmp/maintenance-source.tar.gz.b64")
          encoded = encoded_path.read_bytes()
          if hashlib.sha256(encoded).hexdigest() != "769be20ca86d0ef083dcd1965c1e5c1a3e95c361cca881a0a10ff2380697d244":
              raise RuntimeError("maintenance source bundle text checksum mismatch")

          archive = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(archive).hexdigest() != "005c895f7c38d0e4cdac8e4e8f0d5adeb90436c68b1e86bcf4977ce706f695f7":
              raise RuntimeError("maintenance source bundle archive checksum mismatch")

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as source:
              for member in source.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise RuntimeError(f"unsafe maintenance bundle path: {member.name!r}")
                  if member.issym() or member.islnk():
                      raise RuntimeError(f"links are not permitted in maintenance bundle: {member.name!r}")
              source.extractall(".", filter="data")
          PY
          rm -f \
            tests/unit/maintenance/test_domain.py \
            tests/unit/maintenance/test_postgres.py \
            tests/unit/maintenance/test_service.py

      - name: Install dependencies and validate complete source
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q

      - name: Commit exact validated source bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance-transfer
          git add -A -- \
            README.md \
            docs/compatibility.md \
            docs/maintenance.md \
            src/postgres_mcp/lite_server.py \
            src/postgres_mcp/maintenance \
            src/postgres_mcp/server.py \
            tests/integration/maintenance \
            tests/unit/lite/test_lite_server.py \
            tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            .maintenance-transfer
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete reviewed nontransactional maintenance"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${{ github.event.pull_request.head.ref }}
