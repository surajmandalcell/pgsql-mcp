name: Apply reviewed maintenance MCP surface on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-reviewed-maintenance-server-pr
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Apply the reviewed deterministic source transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-maintenance-server.yml').read_text()
          marker = "          python - <<'PY'\n"
          source = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(dedent(source), {"__name__": "__main__"})
          PY

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Format and validate source-only changes
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/postgres_mcp/maintenance \
            src/postgres_mcp/server.py \
            tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            tests/integration/maintenance/test_maintenance_integration.py
          uv run ruff check --fix \
            src/postgres_mcp/maintenance \
            src/postgres_mcp/server.py \
            tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            tests/integration/maintenance/test_maintenance_integration.py
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q tests/unit/maintenance tests/unit/server/test_maintenance_tools.py

      - name: Commit validated source-only changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/maintenance.md src/postgres_mcp/server.py \
            src/postgres_mcp/maintenance tests/unit/maintenance \
            tests/unit/server/test_maintenance_tools.py \
            tests/integration/maintenance/test_maintenance_integration.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expose reviewed nontransactional maintenance"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/reviewed-maintenance
