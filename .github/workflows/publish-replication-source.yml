name: Publish validated replication and HA source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-replication-ha-source
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'feature/replication-ha-readiness' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Start Docker
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.6.9'

      - name: Extract and harden exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .replication-transfer/part-* > /tmp/replication-source.tar.gz.b64
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          encoded = Path('/tmp/replication-source.tar.gz.b64').read_bytes()
          if hashlib.sha256(encoded).hexdigest() != '7ebf35734355f7ee01b2e32dfb54b02371c7f429ee5fcee6daa090a93744cc0f':
              raise RuntimeError('replication source Base64 checksum mismatch')
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != '148ba7f90107558ba1a5ffcb2f40dd040d068b1e5c84fcf7a09607bc0bd34964':
              raise RuntimeError('replication source archive checksum mismatch')

          for target in (
              Path('src/postgres_mcp/replication'),
              Path('tests/unit/replication'),
              Path('tests/unit/ha'),
              Path('tests/integration/replication'),
          ):
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()

          with tarfile.open(fileobj=io.BytesIO(compressed), mode='r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise RuntimeError(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise RuntimeError(f'unsupported archive entry: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise RuntimeError(f'unexpected archive entry: {member.name}')
              archive.extractall(path='.', filter='data')

          source_path = Path('src/postgres_mcp/replication/postgres.py')
          source = source_path.read_text()
          old = '''    pg_catalog.pg_is_wal_replay_paused() AS replay_paused,
              CASE WHEN pg_catalog.pg_is_in_recovery() THEN NULL ELSE pg_catalog.pg_current_wal_lsn()::text END AS current_wal_lsn,
              pg_catalog.pg_last_wal_receive_lsn()::text AS received_wal_lsn,
              pg_catalog.pg_last_wal_replay_lsn()::text AS replayed_wal_lsn,
          '''
          new = '''    CASE
                  WHEN pg_catalog.pg_is_in_recovery() THEN pg_catalog.pg_is_wal_replay_paused()
                  ELSE false
              END AS replay_paused,
              CASE WHEN pg_catalog.pg_is_in_recovery() THEN NULL ELSE pg_catalog.pg_current_wal_lsn()::text END AS current_wal_lsn,
              CASE
                  WHEN pg_catalog.pg_is_in_recovery() THEN pg_catalog.pg_last_wal_receive_lsn()::text
                  ELSE NULL
              END AS received_wal_lsn,
              CASE
                  WHEN pg_catalog.pg_is_in_recovery() THEN pg_catalog.pg_last_wal_replay_lsn()::text
                  ELSE NULL
              END AS replayed_wal_lsn,
          '''
          if source.count(old) != 1:
              raise RuntimeError('expected one unguarded replication metadata block')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/unit/replication/test_replication_postgres.py')
          tests = test_path.read_text()
          marker = '\ndef test_row_conversion_builds_complete_topology() -> None:\n'
          contract = '''

def test_metadata_query_guards_recovery_only_functions() -> None:
    from postgres_mcp.replication.postgres import _METADATA_SQL

    normalized = " ".join(_METADATA_SQL.split())
    assert "WHEN pg_catalog.pg_is_in_recovery() THEN pg_catalog.pg_is_wal_replay_paused()" in normalized
    assert "WHEN pg_catalog.pg_is_in_recovery() THEN pg_catalog.pg_last_wal_receive_lsn()::text" in normalized
    assert "WHEN pg_catalog.pg_is_in_recovery() THEN pg_catalog.pg_last_wal_replay_lsn()::text" in normalized
'''
          if tests.count(marker) != 1:
              raise RuntimeError('expected one replication row-conversion test marker')
          test_path.write_text(tests.replace(marker, contract + marker, 1))
          PY

      - name: Validate exact source
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          uv run ruff format src/postgres_mcp/replication tests/unit/replication
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q

      - name: Commit validated source only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/postgres-compatibility.yml
          git add -- \
            README.md docs/compatibility.md docs/replication.md pyproject.toml \
            src/postgres_mcp/__init__.py src/postgres_mcp/ha_server.py \
            src/postgres_mcp/lite_server.py src/postgres_mcp/replication \
            tests/integration/replication tests/unit/ha tests/unit/replication \
            tests/unit/lite/test_lite_server.py tests/unit/lite/test_packaging.py
          git diff --cached --check
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git status --short
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement replication and HA diagnostics'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/replication-ha-readiness
