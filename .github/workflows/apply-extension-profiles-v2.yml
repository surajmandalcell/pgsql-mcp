name: Apply extension capability profiles

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-extension-capability-profiles-v2
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.ref == 'feature/extension-capability-profiles-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Start Docker
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.6.9'

      - name: Apply MCP and documentation surface
        run: python scripts/apply_extension_profiles.py

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Normalize and validate
        run: |
          set -euo pipefail
          uv run ruff format scripts/apply_extension_profiles.py src/postgres_mcp/extension_profiles.py src/postgres_mcp/server.py tests/unit/extensions tests/unit/server/test_extension_profile_factory.py tests/unit/server/test_extension_profile_tools.py tests/integration/extensions
          uv run ruff check --fix scripts/apply_extension_profiles.py src/postgres_mcp/extension_profiles.py src/postgres_mcp/server.py tests/unit/extensions tests/unit/server/test_extension_profile_factory.py tests/unit/server/test_extension_profile_tools.py tests/integration/extensions
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q

      - name: Commit validated source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- README.md scripts/apply_extension_profiles.py src/postgres_mcp/server.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Expose extension capability profiles'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/extension-capability-profiles-v2
