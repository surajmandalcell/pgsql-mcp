name: Format diagnostic

on:
  push:
    branches:
      - agent/bootstrap-local-copy

permissions:
  contents: read

jobs:
  capture-ruff-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Install dependencies
        run: uv sync

      - name: Capture formatter patch
        run: |
          uv run ruff format .
          git diff --binary > ruff-format.diff

      - name: Upload formatter patch
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-patch
          path: ruff-format.diff
          if-no-files-found: error
