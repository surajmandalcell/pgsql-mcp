name: Format diagnostic

on:
  push:
    branches:
      - agent/bootstrap-local-copy

permissions:
  contents: write

jobs:
  apply-ruff-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-local-copy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Install dependencies
        run: uv sync

      - name: Apply formatter
        run: uv run ruff format .

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:agent/bootstrap-local-copy
