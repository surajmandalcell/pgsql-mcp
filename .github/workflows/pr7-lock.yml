name: Finalize lite dependency lock

on:
  push:
    branches:
      - agent/lite-profile
    paths:
      - .github/workflows/pr7-lock.yml

permissions:
  contents: write

concurrency:
  group: pr7-lite-lock
  cancel-in-progress: false

jobs:
  finalize-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout lite branch
        uses: actions/checkout@v4
        with:
          ref: agent/lite-profile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker service
        run: sudo service docker start || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Regenerate dependency lock
        run: uv lock

      - name: Install and test every optional feature
        run: uv sync --frozen --all-extras

      - name: Validate source
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -v --log-cli-level=INFO

      - name: Validate wheel metadata and entry points
        run: |
          uv build --wheel
          uv run python - <<'PY'
          import email
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              entry_points_name = next(name for name in archive.namelist() if name.endswith(".dist-info/entry_points.txt"))
              metadata = email.message_from_bytes(archive.read(metadata_name))
              entry_points = archive.read(entry_points_name).decode()

          requirements = metadata.get_all("Requires-Dist", [])
          instructor = [requirement for requirement in requirements if requirement.lower().startswith("instructor")]
          assert len(instructor) == 1, instructor
          assert "extra == 'llm'" in instructor[0] or 'extra == "llm"' in instructor[0]
          assert "pgsql-mcp = postgres_mcp:main" in entry_points
          assert "pgsql-mcp-lite = postgres_mcp:lite_main" in entry_points
          PY

      - name: Remove one-shot workflow and commit lock
        run: |
          rm .github/workflows/pr7-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/pr7-lock.yml
          git commit -m "Lock the optional LLM dependency graph"
          git push origin HEAD:agent/lite-profile
