name: Publish validated pgvector source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-pgvector-source
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'feature/pgvector-catalog-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PGSQL_MCP_TEST_POSTGRES_IMAGE: postgres:16

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Apply restricted MCP surface and portable query
        run: python scripts/apply_pgvector_server.py

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Validate publishable source
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            scripts/apply_pgvector_server.py \
            src/postgres_mcp/pgvector_diagnostics.py \
            src/postgres_mcp/server.py \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py \
            tests/integration/extensions/test_pgvector_diagnostics_integration.py
          uv run ruff check --fix \
            scripts/apply_pgvector_server.py \
            src/postgres_mcp/pgvector_diagnostics.py \
            src/postgres_mcp/server.py \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py \
            tests/integration/extensions/test_pgvector_diagnostics_integration.py
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py \
            tests/integration/extensions/test_pgvector_diagnostics_integration.py

      - name: Commit publishable source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            docs/pgvector.md \
            src/postgres_mcp/pgvector_diagnostics.py \
            src/postgres_mcp/server.py \
            tests/Dockerfile.postgres-hypopg \
            tests/unit/extensions/test_pgvector_diagnostics.py \
            tests/unit/server/test_pgvector_diagnostic_tools.py \
            tests/integration/extensions/test_pgvector_diagnostics_integration.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expose read-only pgvector catalog diagnostics"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/pgvector-catalog-diagnostics
