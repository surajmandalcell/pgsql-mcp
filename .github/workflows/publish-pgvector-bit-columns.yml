name: Publish pgvector bit-column fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-pgvector-bit-column-fix
  cancel-in-progress: false

jobs:
  validate-commit:
    if: github.event.pull_request.head.ref == 'feature/pgvector-catalog-diagnostics-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Apply final pgvector source
        run: python scripts/apply_pgvector_bit_columns.py

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Validate final source
        shell: bash
        run: |
          set -euo pipefail
          {
            uv run ruff format \
              src/postgres_mcp/pgvector_diagnostics.py \
              tests/unit/extensions/test_pgvector_catalog_validation.py \
              tests/integration/extensions/test_pgvector_diagnostics_integration.py
            uv run ruff check --fix \
              src/postgres_mcp/pgvector_diagnostics.py \
              tests/unit/extensions/test_pgvector_catalog_validation.py \
              tests/integration/extensions/test_pgvector_diagnostics_integration.py
            uv run ruff format --check .
            uv run ruff check .
            uv run pyright
            echo "=== focused pgvector tests ==="
            uv run pytest -q \
              tests/unit/extensions/test_pgvector_diagnostics.py \
              tests/unit/extensions/test_pgvector_catalog_validation.py \
              tests/unit/server/test_pgvector_diagnostic_tools.py
            echo "=== full suite ==="
            uv run pytest -q
          } 2>&1 | tee /tmp/pgvector-publish-validation.txt

      - name: Capture pgvector publish diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short > /tmp/pgvector-publish-status.txt
          git diff --check > /tmp/pgvector-publish-diff-check.txt || true
          git diff --stat > /tmp/pgvector-publish-diff-stat.txt
          git diff > /tmp/pgvector-publish.diff
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=.pytest_cache \
            --exclude='**/__pycache__' \
            -czf /tmp/pgvector-publish-workspace.tar.gz .

      - name: Upload pgvector publish diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pgvector-publish-diagnostics
          path: |
            /tmp/pgvector-publish-validation.txt
            /tmp/pgvector-publish-status.txt
            /tmp/pgvector-publish-diff-check.txt
            /tmp/pgvector-publish-diff-stat.txt
            /tmp/pgvector-publish.diff
            /tmp/pgvector-publish-workspace.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Commit final source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Report indexed pgvector bit columns"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/pgvector-catalog-diagnostics-v2
