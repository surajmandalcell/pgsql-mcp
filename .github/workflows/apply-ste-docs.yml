name: Apply ASD-STE100 documentation rewrite

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-asd-ste100-docs-v2
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.ref == 'docs/asd-ste100-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Start and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo service docker start || true
          docker info

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.6.9"

      - name: Verify and extract documentation bundle
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            8016e592d22273464285c70fddfa6d39bc1f1e993b04fcfdda9c2eb96385999b
            7f35c881dc3c367b2143c89a807982e45b9ac2ffe456dfc20a1a43d331211bf8
            7aff074a76d0c36a009e32990b1bbaf0a398d213a4dbc5c3d158fdcd2d114cd3
            db34014af123950b0c3c99bafe2cfe06bbd6bef97fd5e86f1d03cd18eb2c01f1
            acf3d6ac3345fc565c0893a8087de47413bd3db861344b21c848bcc984b4ce2e
          )
          : > /tmp/ste-docs.b64
          for index in 00 01 02 03 04; do
            path=".ste-transfer/part${index}.b64"
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            expected_index=$((10#$index))
            test "$actual" = "${expected[$expected_index]}"
            cat "$path" >> /tmp/ste-docs.b64
          done
          test "$(sha256sum /tmp/ste-docs.b64 | cut -d' ' -f1)" = "17b044fe71445588311edf06f0bc195788b0148a80a7946de47674784aebef58"
          base64 --decode /tmp/ste-docs.b64 > /tmp/ste-docs.tar.gz
          test "$(sha256sum /tmp/ste-docs.tar.gz | cut -d' ' -f1)" = "b9dc51ff445d2b4f287a22fd70c087ebad5140820783c0f7bfa56559a78b892c"
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path('/tmp/ste-docs.tar.gz')
          expected = {
              'CLAUDE.md',
              'CONTRIBUTING.md',
              'PUBLISHING.md',
              'README.md',
              'docs/architecture/execution-safety.md',
              'docs/asd-ste100.md',
              'docs/catalog.md',
              'docs/compatibility.md',
              'docs/concurrency.md',
              'docs/data-operations.md',
              'docs/extension-objects.md',
              'docs/extensions.md',
              'docs/lite.md',
              'docs/maintenance.md',
              'docs/migrations.md',
              'docs/observability.md',
              'docs/performance.md',
              'docs/providers.md',
              'docs/replication.md',
              'docs/security.md',
              'docs/testing.md',
              'plan.md',
              'scripts/check_ste_docs.py',
              'src/postgres_mcp/explain/README.md',
              'tests/README.md',
              'tests/TEST_PLAN.md',
          }
          with tarfile.open(archive, 'r:gz') as handle:
              names = set()
              for member in handle.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'archive link is not permitted: {member.name}')
                  if not member.isfile():
                      raise SystemExit(f'archive entry must be a file: {member.name}')
                  names.add(member.name)
              if names != expected:
                  missing = sorted(expected - names)
                  extra = sorted(names - expected)
                  raise SystemExit(f'manifest mismatch; missing={missing}; extra={extra}')
              handle.extractall('/tmp/ste-docs', filter='data')
          PY
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "/tmp/ste-docs/$path" "$path"
          done <<'FILES'
          CLAUDE.md
          CONTRIBUTING.md
          PUBLISHING.md
          README.md
          docs/architecture/execution-safety.md
          docs/asd-ste100.md
          docs/catalog.md
          docs/compatibility.md
          docs/concurrency.md
          docs/data-operations.md
          docs/extension-objects.md
          docs/extensions.md
          docs/lite.md
          docs/maintenance.md
          docs/migrations.md
          docs/observability.md
          docs/performance.md
          docs/providers.md
          docs/replication.md
          docs/security.md
          docs/testing.md
          plan.md
          scripts/check_ste_docs.py
          src/postgres_mcp/explain/README.md
          tests/README.md
          tests/TEST_PLAN.md
          FILES
          chmod 755 scripts/check_ste_docs.py

      - name: Install complete dependency set
        run: uv sync --frozen --all-extras

      - name: Validate final source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_ste_docs.py .
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -q

      - name: Commit final documentation source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            git add -- "$path"
          done <<'FILES'
          CLAUDE.md
          CONTRIBUTING.md
          PUBLISHING.md
          README.md
          docs/architecture/execution-safety.md
          docs/asd-ste100.md
          docs/catalog.md
          docs/compatibility.md
          docs/concurrency.md
          docs/data-operations.md
          docs/extension-objects.md
          docs/extensions.md
          docs/lite.md
          docs/maintenance.md
          docs/migrations.md
          docs/observability.md
          docs/performance.md
          docs/providers.md
          docs/replication.md
          docs/security.md
          docs/testing.md
          plan.md
          scripts/check_ste_docs.py
          src/postgres_mcp/explain/README.md
          tests/README.md
          tests/TEST_PLAN.md
          FILES
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rewrite documentation in ASD-STE100 style"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:docs/asd-ste100-v2
