name: pgsql-mcp CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pgsql-mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgsql-mcp-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker service
        run: sudo service docker start || true

      - name: Verify Docker is running
        run: docker info

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply the exact reviewed patch
        run: |
          git apply --check .github/pr6-begin-builder.patch
          git apply .github/pr6-begin-builder.patch
          rm .github/pr6-begin-builder.patch .github/workflows/pr6-review-fix.yml
          cat > .github/workflows/build.yml <<'YAML'
          name: pgsql-mcp CI

          on:
            push:
              branches:
                - main
            pull_request:
              types: [opened, synchronize, reopened]

          permissions:
            contents: read

          concurrency:
            group: pgsql-mcp-ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            pgsql-mcp-ci:
              runs-on: ubuntu-latest
              timeout-minutes: 30

              steps:
                - name: Checkout code
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Start Docker service
                  run: sudo service docker start || true

                - name: Verify Docker is running
                  run: docker info

                - name: Install uv
                  uses: astral-sh/setup-uv@v5
                  with:
                    version: "0.6.9"

                - name: Install dependencies
                  run: uv sync --frozen

                - name: Check formatting and lint
                  run: |
                    uv run ruff format --check .
                    uv run ruff check .

                - name: Check types
                  run: uv run pyright

                - name: Run tests
                  run: |
                    set -o pipefail
                    uv run pytest -v --log-cli-level=INFO --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt

                - name: Upload test diagnostics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: pytest-diagnostics
                    path: |
                      pytest-output.txt
                      pytest-results.xml
                    if-no-files-found: error
          YAML

      - name: Validate the complete reviewed change
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest -v --log-cli-level=INFO

      - name: Commit the reviewed change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Route transaction startup through an allowlisted builder"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
