name: pgsql-mcp CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pgsql-mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgsql-mcp-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker service
        run: sudo service docker start || true

      - name: Verify Docker is running
        run: docker info

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Install dependencies and optional features
        run: uv sync --frozen --all-extras

      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Check types
        run: uv run pyright

      - name: Run tests
        run: |
          set -o pipefail
          uv run pytest -v --log-cli-level=INFO --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-results.xml
          if-no-files-found: error
